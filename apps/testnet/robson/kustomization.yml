# Kustomization for Robson Testnet
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace (sync-wave: -1 — must exist before other resources)
  - namespace.yml
  # RBAC
  - robsond-rbac.yml
  # ConfigMap (includes ROBSON_BINANCE_USE_TESTNET: "true")
  - robsond-config.yml
  # Database external service (robson-testnet namespace — no cross-namespace refs)
  - paradedb-svc.yml
  # DB migration Job (ArgoCD Sync hook, wave -1, mirrors prod)
  - robsond-db-migrate-job.yml
  # Daemon
  - robsond-deploy.yml
  - robsond-svc.yml

labels:
  - pairs:
      app.kubernetes.io/part-of: robson
      environment: testnet
    includeSelectors: false

# Pattern R: single pin for every robson-v2 image (deploy + migrate hook).
images:
  - name: ghcr.io/rbxrobotica/robson-v2
    newTag: sha-d5803c47
