# RBX Atlas, phase 2 of the ADR-0028 topology amendment (2026-09-06): identity-
# gated internal exposure (ATLAS_EXPOSURE=internal, ATLAS_AUTH=oidc) against
# RBX Identity (ZITADEL, https://auth.merovelis.com), role rbx:atlas:founder.
# The image is Bun-first (oven/bun, UID 1000) and serves on 3000.
#
# replicas is pinned to 1: rbx-atlas's login-flow replay-prevention store
# (src/lib/server/auth/flow.ts in rbx-atlas) is process-local only, with no
# shared storage across pods. At replicas:2 a flow's single-use guarantee
# would not hold across pods (documented, known gap in rbx-atlas
# docs/deployment.md). Do not raise this above 1 until that store moves to
# shared storage (e.g. Redis) or routing is pinned sticky to one pod.
#
# The registry pull secret ghcr-pull-secret and the application secret
# rbx-atlas-secrets (OIDC_CLIENT_SECRET, SESSION_SECRET) must exist in the
# namespace before sync (k8s-secrets bootstrap role); otherwise the pod fails
# with ImagePullBackOff or CreateContainerConfigError.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-atlas
  namespace: rbx-atlas
  labels:
    app.kubernetes.io/name: rbx-atlas
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rbx-atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-atlas
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: atlas
          image: ghcr.io/rbxrobotica/rbx-atlas
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: rbx-atlas-secrets
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: ATLAS_EXPOSURE
              value: "internal"
            - name: ATLAS_AUTH
              value: "oidc"
            - name: ORIGIN
              value: "https://atlas.rbx.ia.br"
            - name: PROTOCOL_HEADER
              value: "x-forwarded-proto"
            - name: HOST_HEADER
              value: "x-forwarded-host"
            - name: ADDRESS_HEADER
              value: "x-forwarded-for"
            - name: XFF_DEPTH
              value: "1"
            - name: OIDC_ISSUER
              value: "https://auth.merovelis.com"
            - name: OIDC_CLIENT_ID
              value: "389512490368632478"
            - name: OIDC_REDIRECT_URI
              value: "https://atlas.rbx.ia.br/auth/callback"
            - name: OIDC_SCOPES
              value: "openid profile urn:zitadel:iam:org:project:role:rbx:atlas:founder"
            - name: OIDC_ALLOWED_ORG_IDS
              value: "375992756025229511"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 300m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
