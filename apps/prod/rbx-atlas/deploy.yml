# RBX Atlas, phase 1 of the ADR-0028 topology amendment (2026-09-05): public
# exposure only. The image is Bun-first (oven/bun, UID 1000) and serves on 3000;
# ATLAS_EXPOSURE=public is also the image default. Internal exposure is refused
# by the application off the loopback interface, so this Deployment cannot be
# switched to it without the phase 2 identity-gated mode (ATLAS_AUTH=oidc) and
# the secrets that mode needs. No ConfigMap or Secret is consumed in phase 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-atlas
  namespace: rbx-atlas
  labels:
    app.kubernetes.io/name: rbx-atlas
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rbx-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-atlas
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rbx-atlas
                topologyKey: kubernetes.io/hostname
      containers:
        - name: atlas
          image: ghcr.io/rbxrobotica/rbx-atlas:sha-0000000
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: ATLAS_EXPOSURE
              value: "public"
            - name: ORIGIN
              value: "https://atlas.rbx.ia.br"
            - name: PROTOCOL_HEADER
              value: "x-forwarded-proto"
            - name: HOST_HEADER
              value: "x-forwarded-host"
            - name: ADDRESS_HEADER
              value: "x-forwarded-for"
            - name: XFF_DEPTH
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 300m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
