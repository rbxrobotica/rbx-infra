# Kustomization for rbx-atlas (founders' frontend discovery directory, ADR-0028).
# First promotion (2026-09-06): the tag is the image published by the rbx-atlas
# publish workflow from main fabc775. The Argo CD Application stays on manual
# sync through the validated first rollout; a separate pull request enables
# automated sync, after which the rbx-atlas publish workflow promotes tags
# (docs/infra/IMAGE-PROMOTION.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rbx-atlas
resources:
  - namespace.yml
  - middleware.yml
  - deploy.yml
  - svc.yml
  - certificate.yml
  - ingressroute.yml
labels:
  - pairs:
      app.kubernetes.io/part-of: rbx-atlas
      environment: production
    includeSelectors: false
images:
  - name: ghcr.io/rbxrobotica/rbx-atlas
    newTag: sha-bc4e94d
