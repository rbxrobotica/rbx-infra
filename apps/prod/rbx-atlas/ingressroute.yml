# IngressRoutes: RBX Atlas (atlas.rbx.ia.br), ADR-0028 topology amendment
# 2026-09-05, phase 1. DNS record in infra/terraform/dns/rbx_ia_br.tf;
# onboarding steps in docs/runbooks/ADD-NEW-APPLICATION.md.
#
# Two routers on purpose (precedent: rbx-flightdeck): a TLS-scoped router
# cannot also serve the plain-HTTP redirect, so `web` gets a non-TLS redirect
# router and `websecure` serves the application.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rbx-atlas-web
  namespace: rbx-atlas
spec:
  entryPoints:
    - web
  routes:
    # HTTP to HTTPS permanent redirect
    - match: Host(`atlas.rbx.ia.br`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: rbx-atlas
      services:
        - name: rbx-atlas
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rbx-atlas
  namespace: rbx-atlas
spec:
  entryPoints:
    - websecure
  routes:
    # HTTPS to the SvelteKit server run by Bun (public exposure in phase 1)
    - match: Host(`atlas.rbx.ia.br`)
      kind: Rule
      services:
        - name: rbx-atlas
          port: 80
  tls:
    secretName: rbx-atlas-tls
