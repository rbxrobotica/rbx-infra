---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: iteruno-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# The certificate is issued by HTTP-01, so it stays pending until both host names
# resolve to the cluster ingress (the DNS cutover is a separate change in
# infra/terraform/dns/spaceship_domains.tf). www is redirected to the apex by the image's nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iteruno
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: websites-iteruno-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [iteruno.com, www.iteruno.com]
      secretName: iteruno-tls
  rules:
    - host: iteruno.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iteruno
                port:
                  name: http
    - host: www.iteruno.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iteruno
                port:
                  name: http
