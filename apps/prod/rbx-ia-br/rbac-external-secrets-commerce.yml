# Commerce's External Secrets reader needs its grant in the source namespace.
# Keeping this Role and RoleBinding in the rbx-ia-br overlay prevents the
# rbx-commerce Kustomize namespace transformer from moving them to Commerce.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-commerce-secret
  namespace: rbx-ia-br
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rbx-commerce-secrets", "rbx-commerce-consumption-key"]
    verbs: ["get"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-reader-commerce
  namespace: rbx-ia-br
subjects:
  - kind: ServiceAccount
    name: external-secrets-reader
    namespace: rbx-commerce
roleRef:
  kind: Role
  name: read-commerce-secret
  apiGroup: rbac.authorization.k8s.io
