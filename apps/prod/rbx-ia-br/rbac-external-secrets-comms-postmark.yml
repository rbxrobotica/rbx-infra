# Source access belongs in rbx-ia-br, outside the destination overlay's
# namespace transformer. Kubernetes authorizes the whole named Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-comms-postmark-webhook-auth
  namespace: rbx-ia-br
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["comms-postmark-webhook-auth"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-reader-comms-postmark
  namespace: rbx-ia-br
subjects:
  - kind: ServiceAccount
    name: external-secrets-reader
    namespace: rbx-comms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-comms-postmark-webhook-auth
