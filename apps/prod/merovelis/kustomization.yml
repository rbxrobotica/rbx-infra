# Kustomization for Merovelis Production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - middleware-https.yml
  - merovelis-site-deploy.yml
  - merovelis-site-svc.yml
  - merovelis-site-ingress.yml
  - institutional-externalsecrets.yml
  - institutional-deploy.yml
  - institutional-svc.yml
  - content/compare-job.yml
  - content/publish-job.yml
labels:
  - pairs:
      app.kubernetes.io/part-of: merovelis
      environment: production
    includeSelectors: false
images:
  # Tags promoted by the app repo CI (RBX_INFRA_PAT self-push, issue #168).
  # See gitops/app-of-apps/merovelis-prod.yml and docs/infra/IMAGE-PROMOTION.md.
  - name: ghcr.io/rbxrobotica/merovelis-site
    newTag: sha-28e2e18
  # The institutional site. Promoted by hand with a reviewed change: the tag
  # and the digest change together.
  - name: ghcr.io/rbxrobotica/rbx-ia-br
    newTag: sha-26d103f
    digest: sha256:2c4d8bbe82d1828ad68ed71cb3ba842e52f90ab9872b233dc6a9d88c50de8258
# Inputs of the one-off content Jobs (content/). The candidates are
# site-content/ of rbx-systems-frontend at 26d103f, and the capture is its
# site-content-recovery/2026-11-07-cache-rescue/site, one file per page with
# the path flattened. The name suffix follows the content, so a Job always
# reads the files it was reviewed with.
configMapGenerator:
  - name: site-content-job
    namespace: merovelis
    files:
      - content/site-content-job.mjs
  - name: site-content-candidates
    namespace: merovelis
    files:
