# The institutional site reads the content store and the LLM gateway with the
# same credentials as rbx-ia-br. They are replicated from that namespace, as
# rbxsystems-ch does. The reader is granted in
# apps/prod/rbx-ia-br/rbac-external-secrets-reader.yml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: merovelis
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes-store
  namespace: merovelis
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-secrets-reader
      remoteNamespace: rbx-ia-br
      server:
        url: https://kubernetes.default.svc.cluster.local
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contabo-s3-credentials
  namespace: merovelis
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: contabo-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: contabo-s3-credentials
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: contabo-s3-credentials
        property: AWS_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-llm-secrets
  namespace: merovelis
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-llm-secrets
    creationPolicy: Owner
  data:
    - secretKey: LLM_GATEWAY_KEY
      remoteRef:
        key: rbx-llm-secrets
        property: LLM_GATEWAY_KEY
