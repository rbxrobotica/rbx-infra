apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rbx-identity
resources:
  - grant-reconciler-deploy.yml
  - grant-reconciler-svc.yml
  - network-policy.yml
# Pinned to the first publish of the service, from the rbx-identity
# "Publish grant reconciler image" workflow on main. Pattern R: the immutable
# tag lives here, never in the deploy manifest.
images:
  - name: ghcr.io/rbxrobotica/rbx-grant-reconciler
    newTag: sha-3ee59ab
