# ClusterIP only. ZITADEL reaches the target over the cluster network; there is
# no public Ingress, so the webhook surface is not exposed to the internet even
# though every request is HMAC verified.
apiVersion: v1
kind: Service
metadata:
  name: rbx-grant-reconciler
  namespace: rbx-identity
  labels:
    app.kubernetes.io/name: rbx-grant-reconciler
    app.kubernetes.io/part-of: rbx-identity
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rbx-grant-reconciler
  ports:
    - name: http
      port: 80
      targetPort: http
