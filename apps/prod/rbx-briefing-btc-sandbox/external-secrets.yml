# All sources below are dedicated sandbox Secrets that do not exist yet.
# None references a production BFF, S3, or consumption credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-briefing-btc-sandbox-oidc
  namespace: rbx-briefing-btc-sandbox
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-briefing-btc-sandbox-oidc
    creationPolicy: Owner
  data:
    - secretKey: RBX_SESSION_BFF_CLIENT_ID
      remoteRef:
        key: rbx-briefing-btc-sandbox-oidc
        property: RBX_SESSION_BFF_CLIENT_ID
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-briefing-btc-sandbox-commerce
  namespace: rbx-briefing-btc-sandbox
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-briefing-btc-sandbox-commerce
    creationPolicy: Owner
  data:
    - secretKey: RBX_COMMERCE_CLIENT_ID
      remoteRef:
        key: rbx-briefing-btc-sandbox-commerce
        property: RBX_COMMERCE_CLIENT_ID
    - secretKey: RBX_COMMERCE_CLIENT_SECRET
      remoteRef:
        key: rbx-briefing-btc-sandbox-commerce
        property: RBX_COMMERCE_CLIENT_SECRET
    - secretKey: RBX_COMMERCE_MACHINE_KEY_JSON
      remoteRef:
        key: rbx-briefing-btc-sandbox-commerce
        property: RBX_COMMERCE_MACHINE_KEY_JSON
    - secretKey: RBX_COMMERCE_AUDIENCE
      remoteRef:
        key: rbx-briefing-btc-sandbox-commerce
        property: RBX_COMMERCE_AUDIENCE
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-briefing-btc-sandbox-consumption
  namespace: rbx-briefing-btc-sandbox
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-briefing-btc-sandbox-consumption
    creationPolicy: Owner
  data:
    - secretKey: COMMERCE_CONSUMPTION_SERVICE_KEY
      remoteRef:
        key: rbx-briefing-btc-sandbox-consumption
        property: COMMERCE_CONSUMPTION_SERVICE_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-briefing-btc-sandbox-content
  namespace: rbx-briefing-btc-sandbox
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-briefing-btc-sandbox-content
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: rbx-briefing-btc-sandbox-content
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: rbx-briefing-btc-sandbox-content
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: BRIEFING_S3_ENDPOINT
      remoteRef:
        key: rbx-briefing-btc-sandbox-content
        property: BRIEFING_S3_ENDPOINT
    - secretKey: BRIEFING_S3_BUCKET
      remoteRef:
        key: rbx-briefing-btc-sandbox-content
        property: BRIEFING_S3_BUCKET
    - secretKey: BRIEFING_S3_PREFIX
      remoteRef:
        key: rbx-briefing-btc-sandbox-content
        property: BRIEFING_S3_PREFIX
