# Deliberately scaled to zero. Replace the reserved .invalid origin and add a
# separate ingress/TLS/DNS change only after the OIDC and sandbox content gates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-briefing-btc-sandbox
  namespace: rbx-briefing-btc-sandbox
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-briefing-btc-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-briefing-btc-sandbox
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: briefing-btc
          image: ghcr.io/rbxrobotica/rbx-briefing-btc
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: rbx-briefing-btc-sandbox-content
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: ORIGIN
              value: https://briefing-btc-sandbox.invalid
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            - name: ADDRESS_HEADER
              value: x-forwarded-for
            - name: XFF_DEPTH
              value: "1"
            - name: RBX_SESSION_BFF_BASE_URL
              value: http://rbx-briefing-btc-sandbox-session-bff.rbx-briefing-btc-sandbox.svc.cluster.local:8081
            - name: RBX_SESSION_COOKIE_NAME
              value: __Host-rbx_briefing_sandbox_session
            - name: RBX_SESSION_CSRF_COOKIE_NAME
              value: __Host-rbx_briefing_sandbox_csrf
            - name: COMMERCE_BASE_URL
              value: http://rbx-commerce-sandbox.rbx-commerce-sandbox.svc.cluster.local
            - name: COMMERCE_CONSUMPTION_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-briefing-btc-sandbox-consumption
                  key: COMMERCE_CONSUMPTION_SERVICE_KEY
            - name: BRIEFING_PUBLIC_SITE_PT
              value: https://briefing-btc-sandbox.invalid
            - name: BRIEFING_PUBLIC_SITE_EN
              value: https://briefing-btc-sandbox.invalid
          readinessProbe:
            httpGet:
              path: /briefing-btc/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /briefing-btc/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 300m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: rbx-briefing-btc-sandbox
  namespace: rbx-briefing-btc-sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rbx-briefing-btc-sandbox
  ports:
    - name: http
      port: 80
      targetPort: http
