# The source RBAC is deliberately absent from this preparatory overlay. Grant
# this ServiceAccount read access only to the four sandbox source Secrets in
# rbx-ia-br in a separately reviewed step after the sources exist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: rbx-briefing-btc-sandbox
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes-store
  namespace: rbx-briefing-btc-sandbox
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-secrets-reader
      remoteNamespace: rbx-ia-br
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
        url: https://kubernetes.default.svc.cluster.local
