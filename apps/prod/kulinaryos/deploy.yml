apiVersion: apps/v1
kind: Deployment
metadata:
  name: kulinaryos-web
  namespace: kulinaryos
  labels:
    app.kubernetes.io/name: kulinaryos-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kulinaryos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kulinaryos-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kulinaryos-web
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kulinaryos-web
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/rbxrobotica/kulinaryos-web
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: ORIGIN
              value: https://kulinaryos.rbx.ia.br
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
