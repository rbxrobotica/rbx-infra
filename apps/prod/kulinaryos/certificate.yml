apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kulinaryos-tls
  namespace: kulinaryos
spec:
  dnsNames:
    - kulinaryos.rbx.ia.br
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: kulinaryos-tls
  usages:
    - digital signature
    - key encipherment
