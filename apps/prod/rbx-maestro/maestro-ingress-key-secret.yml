# ExternalSecret syncs maestro-ingress-key from rbx-ia-br namespace.
# Enables the workstation interactive-ingress surface (AGENT_LOOP_INGRESS_KEY,
# ADR-0405 Phase S): a credential scoped to interactive ensure and
# mission-detail reads only. Manual Opaque Secret must be provisioned in
# rbx-ia-br (value already generated in pass, never echoed):
#   kubectl create secret generic maestro-ingress-key -n rbx-ia-br \
#     --from-literal=key="$(pass show rbx/maestro/ingress-key)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maestro-ingress-key
  namespace: rbx-maestro
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: maestro-ingress-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: maestro-ingress-key
        property: key
