# ExternalSecret syncs maestro-flightdeck-key from rbx-ia-br namespace.
# Enables the Flight Deck admission ingress (AGENT_LOOP_FLIGHTDECK_KEY,
# rbx-maestro ADR-0006). Admission only: the distinct dispatch key that
# activates work (AGENT_LOOP_FLIGHTDECK_DISPATCH_KEY) is deliberately NOT
# provisioned. Production activation needs its own decision (strategos-core
# ADR-0010 §11, Mandato).
# Manual Opaque Secret must be provisioned in rbx-ia-br with the same value the
# Flight Deck side reads as MAESTRO_ADMIT_KEY (docs/runbooks/DECISION-TO-ACTION-BRIDGE.md):
#   pass insert rbx/maestro/flightdeck-key
#   kubectl create secret generic maestro-flightdeck-key -n rbx-ia-br \
#     --from-literal=key="$(pass show rbx/maestro/flightdeck-key)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maestro-flightdeck-key
  namespace: rbx-maestro
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: maestro-flightdeck-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: maestro-flightdeck-key
        property: key
