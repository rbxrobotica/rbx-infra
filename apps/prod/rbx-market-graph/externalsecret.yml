# Source Secret is created only by an authorized operator in rbx-ia-br.
# DATABASE_URL uses the non-owner rbx_market_graph_app role.
# MIGRATION_DATABASE_URL uses the schema-owner migration role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-market-graph-secrets
  namespace: rbx-market-graph
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-market-graph-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: rbx-market-graph-secrets
        property: DATABASE_URL
    - secretKey: MIGRATION_DATABASE_URL
      remoteRef:
        key: rbx-market-graph-secrets
        property: MIGRATION_DATABASE_URL
    - secretKey: OIDC_ISSUER
      remoteRef:
        key: rbx-market-graph-secrets
        property: OIDC_ISSUER
    - secretKey: OIDC_AUDIENCE
      remoteRef:
        key: rbx-market-graph-secrets
        property: OIDC_AUDIENCE
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: rbx-market-graph-secrets
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: rbx-market-graph-secrets
        property: OIDC_CLIENT_SECRET
    - secretKey: OIDC_REDIRECT_URI
      remoteRef:
        key: rbx-market-graph-secrets
        property: OIDC_REDIRECT_URI
    - secretKey: OIDC_API_SCOPE
      remoteRef:
        key: rbx-market-graph-secrets
        property: OIDC_API_SCOPE
    - secretKey: SESSION_SECRET
      remoteRef:
        key: rbx-market-graph-secrets
        property: SESSION_SECRET
    - secretKey: ORIGIN
      remoteRef:
        key: rbx-market-graph-secrets
        property: ORIGIN
