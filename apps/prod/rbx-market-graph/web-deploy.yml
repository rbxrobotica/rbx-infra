apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-market-graph-web
  namespace: rbx-market-graph
  labels:
    app.kubernetes.io/name: rbx-market-graph-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: rbx-market-graph
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-market-graph-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-market-graph-web
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/rbxrobotica/rbx-market-graph-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: AUTH_MODE
              value: oidc
            - name: API_BASE_URL
              value: http://rbx-market-graph-api:8080
            - name: ORIGIN
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: ORIGIN
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: OIDC_ISSUER
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: OIDC_REDIRECT_URI
            - name: OIDC_API_SCOPE
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: OIDC_API_SCOPE
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: SESSION_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
