apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rbx-market-graph
resources:
  - namespace.yml
  - external-secrets-rbac.yml
  - secretstore.yml
  - externalsecret.yml
  - middleware.yml
  - certificate.yml
  - ingressroute.yml
  - postgres-svc.yml
  - network-policy.yml
  - services.yml
  - pdb.yml
  - db-migrate-job.yml
  - api-deploy.yml
  - web-deploy.yml
labels:
  - pairs:
      app.kubernetes.io/part-of: rbx-market-graph
      environment: production
    includeSelectors: false
images:
  # Both immutable tags are promoted atomically by the product build workflow.
  - name: ghcr.io/rbxrobotica/rbx-market-graph-api
    newTag: sha-9479b8ee78f896e2c71c54b547a909afec36930c
  - name: ghcr.io/rbxrobotica/rbx-market-graph-web
    newTag: sha-9479b8ee78f896e2c71c54b547a909afec36930c
