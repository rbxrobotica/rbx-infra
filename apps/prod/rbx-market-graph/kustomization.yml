apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rbx-market-graph
resources:
  - namespace.yml
  - external-secrets-rbac.yml
  - secretstore.yml
  - externalsecret.yml
  - postgres-svc.yml
  - network-policy.yml
  - services.yml
  - pdb.yml
  - db-migrate-job.yml
  - api-deploy.yml
  - web-deploy.yml
labels:
  - pairs:
      app.kubernetes.io/part-of: rbx-market-graph
      environment: production
    includeSelectors: false
images:
  # Review artifact only. This tag is not promoted or expected to exist until
  # the application release gate publishes the reviewed source commit.
  - name: ghcr.io/rbxrobotica/rbx-market-graph-api
    newTag: sha-de4a1ae129ea80c998695d15e22d82d3e39fdb4a
  - name: ghcr.io/rbxrobotica/rbx-market-graph-web
    newTag: sha-de4a1ae129ea80c998695d15e22d82d3e39fdb4a
