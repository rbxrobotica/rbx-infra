apiVersion: batch/v1
kind: Job
metadata:
  name: rbx-market-graph-db-migrate
  namespace: rbx-market-graph
  labels:
    app.kubernetes.io/name: rbx-market-graph-api
    app.kubernetes.io/component: db-migrate
    app.kubernetes.io/part-of: rbx-market-graph
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-market-graph-api
        app.kubernetes.io/component: db-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/rbxrobotica/rbx-market-graph-api
          imagePullPolicy: IfNotPresent
          command:
            - /migrate
          args:
            - -path=/migrations
            - -database=$(MIGRATION_DATABASE_URL)
            - up
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-market-graph-secrets
                  key: MIGRATION_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
