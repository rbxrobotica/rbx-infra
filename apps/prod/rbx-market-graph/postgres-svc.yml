# Product pods use this service name. The external PostgreSQL endpoint is the
# existing Jaguar node and is never embedded in application configuration.
apiVersion: v1
kind: Service
metadata:
  name: rbx-market-graph-postgres
  namespace: rbx-market-graph
spec:
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: rbx-market-graph-postgres
  namespace: rbx-market-graph
subsets:
  - addresses:
      - ip: 161.97.147.76
    ports:
      - name: postgres
        port: 5432
