apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rbx-market-graph-tls
  namespace: rbx-market-graph
spec:
  dnsNames:
    - kairos.rbxsystems.ch
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: rbx-market-graph-tls
  usages:
    - digital signature
    - key encipherment
