# IngressRoutes: presence.rbx.ia.br routes to the web console; /api/v1 on the same host routes
# to the API so machine callers that require HTTPS (the Flight Deck outbox worker, rbx-flightdeck
# ADR 0010) can reach it. The API enforces its own bearer/OIDC auth on every /api/v1 route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rbx-public-presence-web-redirect
  namespace: rbx-public-presence
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`presence.rbx.ia.br`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: rbx-public-presence
      services:
        - name: rbx-public-presence-web
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rbx-public-presence-web
  namespace: rbx-public-presence
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`presence.rbx.ia.br`)
      kind: Rule
      priority: 10
      services:
        - name: rbx-public-presence-web
          port: 80
    # Machine API (Flight Deck source events, creative job results). Higher priority than
    # the console rule so /api/v1/* never reaches the SvelteKit web app.
    - match: Host(`presence.rbx.ia.br`) && PathPrefix(`/api/v1`)
      kind: Rule
      priority: 20
      services:
        - name: rbx-public-presence-api
          port: 8080
  tls:
    secretName: rbx-public-presence-tls
