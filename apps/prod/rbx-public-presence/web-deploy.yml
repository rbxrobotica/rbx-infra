# rbx-public-presence web: SvelteKit console on Bun (adapter-node). ZITADEL OIDC in-app, BFF to the api Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-public-presence-web
  namespace: rbx-public-presence
  labels:
    app.kubernetes.io/name: rbx-public-presence-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: rbx-public-presence
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-public-presence-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-public-presence-web
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/rbxrobotica/rbx-public-presence-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: ORIGIN
              value: https://presence.rbx.ia.br
            - name: NODE_ENV
              value: production
            - name: PRESENCE_AUTH
              value: oidc
            - name: OIDC_ISSUER
              value: https://auth.merovelis.com
            - name: OIDC_REDIRECT_URI
              value: https://presence.rbx.ia.br/auth/callback
            - name: OIDC_SCOPES
              value: openid profile urn:zitadel:iam:org:project:role:rbx:public-presence:founder
            - name: PRESENCE_API_URL
              value: http://rbx-public-presence-api.rbx-public-presence.svc.cluster.local:8080
          envFrom:
            - secretRef:
                name: rbx-public-presence-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
