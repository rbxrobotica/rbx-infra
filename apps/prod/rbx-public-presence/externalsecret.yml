# ExternalSecret syncs rbx-public-presence-secrets from rbx-ia-br.
# pass is the source of truth (rbx/public-presence/*). Keys:
#   DATABASE_URL                  postgres://public_presence:<pw>@rbx-public-presence-postgres:5432/public_presence?sslmode=disable
#   PRESENCE_SERVICE_KEY          32+ hex chars; shared by api and web (BFF)
#   SESSION_SECRET                base64url, 32 random bytes (web)
#   OIDC_CLIENT_ID                ZITADEL client for the console
#   OIDC_CLIENT_SECRET            ZITADEL client secret
#   OIDC_ALLOWED_ORG_IDS          comma-separated ZITADEL org ids (empty admits nobody)
#   PRESENCE_IG_PSYCTL_TOKEN      Instagram long-lived token for @psyctl (60 days; rotate)
#   PRESENCE_IG_PSYCTL_USER_ID    Instagram professional account id
#   PRESENCE_LI_PSYCTL_TOKEN      LinkedIn member token (60 days; rotate)
#   PRESENCE_LI_PSYCTL_AUTHOR_URN urn:li:person:<id>
#   CREATIVE_LLM_API_KEY          credential for the authorized LLM path (may be empty)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-public-presence-secrets
  namespace: rbx-public-presence
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-public-presence-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rbx-public-presence-secrets
