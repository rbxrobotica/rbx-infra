apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rbx-public-presence
resources:
  - namespace.yml
  - rbac-external-secrets.yml
  - secretstore.yml
  - externalsecret.yml
  - externalsecret-s3.yml
  - middleware.yml
  - certificate.yml
  - ingressroute.yml
  - postgres-svc.yml
  - api-deploy.yml
  - api-svc.yml
  - web-deploy.yml
  - web-svc.yml
  - db-migrate-job.yml
labels:
  - pairs:
      app.kubernetes.io/part-of: rbx-public-presence
      environment: production
    includeSelectors: false
images:
  # Promoted by rbx-public-presence CI on each main build (sha-<commit>; docs/infra/IMAGE-PROMOTION.md).
  # First real pin (2026-09-23): rbx-public-presence main 38d9c91, CI green, both images
  # built by publish-images run 35832551116. The CI self-push step failed only because
  # RBX_INFRA_PAT is not visible to that repository yet (docs/runbooks/DECISION-TO-ACTION-BRIDGE.md).
  - name: ghcr.io/rbxrobotica/rbx-public-presence-api
    newTag: sha-38d9c9148dca2368964da5b1095c3da04d3635d3
  - name: ghcr.io/rbxrobotica/rbx-public-presence-web
    newTag: sha-38d9c9148dca2368964da5b1095c3da04d3635d3
