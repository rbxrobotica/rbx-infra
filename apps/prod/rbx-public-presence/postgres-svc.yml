# Selectorless Service + Endpoints to the external Postgres host (jaguar). Never add a selector.
# DB/role bootstrap: bootstrap/scripts/bootstrap-external-postgres-app-db.sh
apiVersion: v1
kind: Service
metadata:
  name: rbx-public-presence-postgres
  namespace: rbx-public-presence
spec:
  ports:
    - port: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: rbx-public-presence-postgres
  namespace: rbx-public-presence
subsets:
  - addresses:
      - ip: 161.97.147.76
    ports:
      - port: 5432
