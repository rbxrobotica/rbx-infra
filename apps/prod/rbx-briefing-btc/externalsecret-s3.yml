# ExternalSecret syncs contabo-s3-credentials from rbx-ia-br namespace.
# The web app reads briefing editions from the rbx-content bucket
# (prefix robson/market-briefings, written by the rbx-market-briefing CronJob).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contabo-s3-credentials
  namespace: rbx-briefing-btc
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: contabo-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: contabo-s3-credentials
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: contabo-s3-credentials
        property: AWS_SECRET_ACCESS_KEY
