# Mirror only the dedicated edition-view credential. The source Secret in
# rbx-ia-br contains this key alone; do not give the product access to the
# broad rbx-commerce-secrets source Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-commerce-consumption-key
  namespace: rbx-briefing-btc
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-commerce-consumption-key
    creationPolicy: Owner
  data:
    - secretKey: COMMERCE_CONSUMPTION_SERVICE_KEY
      remoteRef:
        key: rbx-commerce-consumption-key
        property: COMMERCE_CONSUMPTION_SERVICE_KEY
