# References only. Values are provisioned outside Git in the rbx-ia-br namespace
# and mirrored here for the dedicated rbx-briefing-btc session BFF.
#
# rbx-briefing-btc-session-bff-oidc: the ZITADEL client id of the Briefing BTC
# public PKCE client (no client secret). Source: k8s-secrets Ansible role, pass
# key rbx/briefing-btc/oidc-client-id.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-briefing-btc-session-bff-oidc
  namespace: rbx-briefing-btc
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-briefing-btc-session-bff-oidc
    creationPolicy: Owner
  data:
    - secretKey: RBX_SESSION_BFF_CLIENT_ID
      remoteRef:
        key: rbx-briefing-btc-session-bff-oidc
        property: RBX_SESSION_BFF_CLIENT_ID
---
# rbx-session-bff-commerce: the shared commerce entitlement service account,
# same central secret the Strategos BFF mirrors (gitops/app-of-apps/rbx-identity.yml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-session-bff-commerce
  namespace: rbx-briefing-btc
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-session-bff-commerce
    creationPolicy: Owner
  data:
    - secretKey: RBX_COMMERCE_CLIENT_ID
      remoteRef:
        key: rbx-session-bff-commerce
        property: RBX_COMMERCE_CLIENT_ID
    - secretKey: RBX_COMMERCE_CLIENT_SECRET
      remoteRef:
        key: rbx-session-bff-commerce
        property: RBX_COMMERCE_CLIENT_SECRET
    - secretKey: RBX_COMMERCE_MACHINE_KEY_JSON
      remoteRef:
        key: rbx-session-bff-commerce
        property: RBX_COMMERCE_MACHINE_KEY_JSON
    - secretKey: RBX_COMMERCE_AUDIENCE
      remoteRef:
        key: rbx-session-bff-commerce
        property: RBX_COMMERCE_AUDIENCE
