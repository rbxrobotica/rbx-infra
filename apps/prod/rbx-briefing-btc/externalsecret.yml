# Pulls SESSION_SECRET from the rbx-ia-br source secret named
# rbx-briefing-btc-secrets. Operator creates that source secret via the
# k8s-secrets Ansible role (pass key rbx/briefing-btc/session-secret).
# Reserved for future use: the web app consumes it as an optional secretRef, so
# a missing mirror does not block the first rollout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-briefing-btc-secrets
  namespace: rbx-briefing-btc
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-briefing-btc-secrets
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: rbx-briefing-btc-secrets
        property: SESSION_SECRET
