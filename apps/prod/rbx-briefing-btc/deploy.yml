# rbx-briefing-btc: the logged-in Briefing BTC area at
# https://app.merovelis.com/briefing-btc (rbx-governance ADR-0014 canonical
# entrypoint). SvelteKit on Bun (adapter-node, UID 1000) serving on 3000 with
# kit.paths.base = '/briefing-btc', so assets live under /briefing-btc/_app/
# and the health endpoint is /briefing-btc/healthz.
#
# Authentication goes through the product-local rbx-session-bff instance in
# this namespace (session-bff.yml), reached over cluster DNS; the web app never
# talks to ZITADEL directly. Briefing editions are read from the Contabo S3
# bucket rbx-content (prefix robson/market-briefings) with the central
# contabo-s3-credentials mirrored by externalsecret-s3.yml.
#
# replicas is pinned to 1 to match the BFF's in-memory session store; raise
# both together only once the BFF moves to a shared store.
#
# The registry pull secret ghcr-pull-secret (k8s-secrets bootstrap role) and
# the contabo-s3-credentials mirror must exist before sync; rbx-briefing-btc-
# secrets (SESSION_SECRET) is reserved for future use and declared optional.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-briefing-btc
  namespace: rbx-briefing-btc
  labels:
    app.kubernetes.io/name: rbx-briefing-btc
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rbx-briefing-btc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-briefing-btc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-briefing-btc
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: briefing-btc
          image: ghcr.io/rbxrobotica/rbx-briefing-btc
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: contabo-s3-credentials
            - secretRef:
                name: rbx-briefing-btc-secrets
                optional: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: ORIGIN
              value: "https://app.merovelis.com"
            - name: PROTOCOL_HEADER
              value: "x-forwarded-proto"
            - name: HOST_HEADER
              value: "x-forwarded-host"
            - name: ADDRESS_HEADER
              value: "x-forwarded-for"
            - name: XFF_DEPTH
              value: "1"
            - name: RBX_SESSION_BFF_BASE_URL
              value: "http://rbx-briefing-btc-session-bff.rbx-briefing-btc.svc.cluster.local:8081"
            - name: RBX_SESSION_COOKIE_NAME
              value: "__Host-rbx_briefing_session"
            - name: RBX_SESSION_CSRF_COOKIE_NAME
              value: "__Host-rbx_briefing_csrf"
            - name: BRIEFING_S3_ENDPOINT
              value: "https://eu2.contabostorage.com"
            - name: BRIEFING_S3_BUCKET
              value: "rbx-content"
            - name: BRIEFING_S3_PREFIX
              value: "robson/market-briefings"
            - name: BRIEFING_PUBLIC_SITE_PT
              value: "https://rbx.ia.br/briefing-btc"
            - name: BRIEFING_PUBLIC_SITE_EN
              value: "https://rbxsystems.ch/briefing-btc"
          readinessProbe:
            httpGet:
              path: /briefing-btc/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /briefing-btc/healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 300m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
