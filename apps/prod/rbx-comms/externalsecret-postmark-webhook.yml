# The dedicated source contains username, password and a matching bcrypt
# htpasswd line. Never reuse the outbound Postmark server API token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: comms-postmark-webhook-auth
  namespace: rbx-comms
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: comms-postmark-webhook-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: comms-postmark-webhook-auth
        property: username
    - secretKey: password
      remoteRef:
        key: comms-postmark-webhook-auth
        property: password
---
# Traefik receives only the password hash; the application receives the two
# plaintext BasicAuth fields above. Authorization must reach the application.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: comms-webhook-basic-auth-postmark
  namespace: rbx-comms
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: comms-webhook-basic-auth-postmark
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: comms-postmark-webhook-auth
        property: htpasswd
