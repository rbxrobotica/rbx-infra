# Published image, first live cluster archive and isolated PostgreSQL restore
# are verified. The daily schedule runs in Kubernetes, independent of a desktop.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rbx-comms-backup
  namespace: rbx-comms
  labels:
    app.kubernetes.io/name: rbx-comms-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "30 3 * * *"
  timeZone: America/Sao_Paulo
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1860
      backoffLimit: 0
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rbx-comms-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          serviceAccountName: rbx-comms-backup
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Use application nodes with proven PostgreSQL access. Jaguar's
          # local pod traffic is rejected by the database's existing HBA.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [tiger, altaica]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/rbxrobotica/comms-backup:sha-a051b67@sha256:fc4a6037f035baa0d229bd86f744ceca1ddb720e672004d0b7ffad1209365124
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: rbx-comms-secrets
                      key: DATABASE_URL
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: contabo-s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: contabo-s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  value: eu-central-1
                - name: S3_ARCHIVE_ENDPOINT
                  value: https://eu2.contabostorage.com
                - name: S3_ARCHIVE_BUCKET
                  value: rbx-data-lake
                - name: BACKUP_PUBLIC_KEY_FILE
                  value: /etc/comms-backup/recipient.asc
                - name: BACKUP_RECIPIENT_FINGERPRINT
                  value: 88C7C5F7E0FB38128BAA46BC5807B2AAF43E3E41
                - name: BACKUP_STAGING_DIR
                  value: /tmp
                - name: BACKUP_MAX_BYTES
                  value: "1073741824"
                - name: BACKUP_TIMEOUT_SECONDS
                  value: "1800"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 512Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 5Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: staging
                  mountPath: /tmp
                - name: recipient
                  mountPath: /etc/comms-backup
                  readOnly: true
          volumes:
            - name: staging
              emptyDir:
                # Disk-backed staging with private permissions, not a claim of
                # encryption at rest or secure erasure of temporary plaintext.
                sizeLimit: 4Gi
            - name: recipient
              configMap:
                name: rbx-comms-backup-recipient
                defaultMode: 0444
