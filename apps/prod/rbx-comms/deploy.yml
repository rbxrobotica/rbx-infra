apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-comms
  namespace: rbx-comms
  labels:
    app.kubernetes.io/name: rbx-comms
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: rbx-comms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-comms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-comms
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api
          image: ghcr.io/rbxrobotica/rbx-comms
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-comms-secrets
                  key: DATABASE_URL
            - name: POSTMARK_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rbx-contact-secrets
                  key: POSTMARK_SERVER_TOKEN
            - name: D360_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-contact-secrets
                  key: D360_API_KEY
            # Dark deployment gate: direct Meta support is present in the
            # image, but all outbound traffic remains explicitly on D360.
            - name: WHATSAPP_PROVIDER
              value: d360
            - name: WHATSAPP_NUMBER
              value: "5511913734954"
            - name: ALTCHA_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-contact-secrets
                  key: ALTCHA_SECRET
            - name: METRICS_ENABLED
              value: "true"
            - name: WORKER_ENABLED
              value: "true"
            - name: D360_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-contact-secrets
                  key: D360_WEBHOOK_SECRET
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-comms-secrets
                  key: REDIS_URL
                  optional: true
            - name: S3_ENDPOINT
              value: "https://eu2.contabostorage.com"
            - name: S3_BUCKET
              value: "rbx-comms-attachments"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: contabo-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: contabo-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_PUBLIC_URL
              value: "https://rbx-comms-attachments.s3.eu2.contabostorage.com"
            - name: COMMS_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-contact-secrets
                  key: COMMS_SERVICE_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
