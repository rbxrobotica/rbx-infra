apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rbx-comms

resources:
  - namespace.yml
  - rbac-external-secrets.yml
  - secretstore.yml
  - externalsecret.yml
  - externalsecret-contact.yml
  - externalsecret-s3.yml
  - middleware.yml
  - certificate.yml
  - ingressroute.yml
  - postgres-svc.yml
  - deploy.yml
  - svc.yml

labels:
  - pairs:
      app.kubernetes.io/part-of: rbx-comms
      environment: production
    includeSelectors: false

images:
  - name: ghcr.io/rbxrobotica/rbx-comms
    # Version-13-compatible rollback candidate. Deploy only under an
    # incident-specific approval after the Satwake image is promoted.
    newTag: sha-9436b8b
    digest: sha256:f622b9be1e31d41109e713c763dc4dfd39560469fbeea6f4747efee3288e5fad
