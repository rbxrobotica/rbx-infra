# Kustomization for rbxsystems-ch (rbxsystems.ch)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - middleware-https.yml
  - deploy.yml
  - svc.yml
  - ingress.yml
  - rbac-external-secrets.yml
  - secretstore-k8s.yml
  - externalsecret-s3.yml
  - externalsecret-contact.yml
  - externalsecret-llm.yml

commonLabels:
  app.kubernetes.io/part-of: rbxsystems-ch
  environment: production

images:
  # Since this image the site answers this host only with a permanent redirect
  # to merovelis.com (rbx-governance ADR-0003, amendment of 2026-11-13). The
  # tag and the digest change together.
  - name: ghcr.io/rbxrobotica/rbx-ia-br
    newTag: sha-26d103f
    digest: sha256:2c4d8bbe82d1828ad68ed71cb3ba842e52f90ab9872b233dc6a9d88c50de8258
