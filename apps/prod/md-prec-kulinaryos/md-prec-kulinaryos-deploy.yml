# md-prec-kulinaryos Deployment
# RBX MPBIC — Modelo de Precificação Baseado em Índice de Complexidade (v1.0)
# SvelteKit (adapter-node) SSR server. App repo: github.com/rbxrobotica/md-prec-kulinaryos
# Container listens on PORT=3000 and exposes GET /health.
# Pattern R (org registry + kustomize images-transformer): the image TAG is set
# in kustomization.yml (images.newTag) and promoted by ArgoCD Image Updater.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: md-prec-kulinaryos
  namespace: md-prec-kulinaryos
  labels:
    app.kubernetes.io/name: md-prec-kulinaryos
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: md-prec-kulinaryos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: md-prec-kulinaryos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: md-prec-kulinaryos
        app.kubernetes.io/component: web
    spec:
      # First canary for the Ubuntu 26.04 pilot on bengal (ADR-0010).
      #
      # Three pieces, and all three are needed for different reasons:
      #
      # - The toleration makes bengal *eligible*. On its own it does not attract
      #   anything: a toleration lifts a restriction, it does not express a
      #   preference.
      # - The preferred nodeAffinity is what actually pulls a replica there. It
      #   is `preferred`, not `required`, so if bengal is gone or full the
      #   Deployment schedules normally instead of going Pending.
      # - The spread constraint keeps the two replicas on different nodes, so
      #   the pilot never holds the whole service. `ScheduleAnyway` keeps this a
      #   preference too.
      #
      # A nodeSelector was deliberately NOT used: it would pin *both* replicas
      # to the pilot node and remove the redundancy that makes this safe to try.
      tolerations:
        - key: rbx.io/os-pilot
          operator: Equal
          value: ubuntu-2604
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: rbx.io/os-pilot
                    operator: In
                    values:
                      - ubuntu-2604
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: md-prec-kulinaryos
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: md-prec-kulinaryos
          # Image name only — tag is injected by kustomization.yml (images-transformer),
          # promoted by ArgoCD Image Updater. See gitops/app-of-apps/md-prec-kulinaryos-prod.yml.
          image: ghcr.io/rbxrobotica/md-prec-kulinaryos
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: ORIGIN
              value: https://md-prec-kulinaryos.rbx.ia.br
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
