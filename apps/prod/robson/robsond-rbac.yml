# Robsond ServiceAccount
#
# robsond, the migrate Jobs and the retention CronJob never call the
# Kubernetes API: configuration and credentials arrive as environment
# variables (configMapRef / secretKeyRef in the pod specs), and the daemon
# has no client for the API server. The former Role granted this account
# get/list/watch on every Secret in the namespace, which a compromised
# trading pod could have used to read its own and any sibling credentials
# through the API. The Role and RoleBinding are gone and the token is no
# longer mounted; the account remains so the pod specs' serviceAccountName
# keeps resolving.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robsond
  namespace: robson
  labels:
    app.kubernetes.io/name: robsond
    app.kubernetes.io/component: daemon
    app.kubernetes.io/part-of: robson
automountServiceAccountToken: false
