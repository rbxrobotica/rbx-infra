# Robson Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robson-redis
  namespace: robson
  labels:
    app.kubernetes.io/name: robson-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: robson
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robson-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robson-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # timeoutSeconds is explicit because the default is 1s, which this
          # container cannot honour reliably. Both probes are `exec`, so each
          # check forks a redis-cli process inside a 100m CPU quota. Under CFS
          # throttling that fork alone can exceed 1s, three checks in a row
          # miss, and the kubelet restarts a healthy Redis.
          #
          # That is not hypothetical: robson-redis reached 101 restarts by
          # 2026-08-18, all with exit code 0 (graceful SIGTERM from the probe,
          # never OOMKilled), clustered around periods of node load. robsond
          # depends on this cache, so the restarts degrade the trading daemon
          # for no reason.
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
