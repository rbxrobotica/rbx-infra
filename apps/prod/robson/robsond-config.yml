# Robsond ConfigMap (Production — MIG-v3#2)
#
# Position monitor disabled for foundation deploy.
# The daemon runs passively — health checks, DB, event sourcing — but
# cannot execute any trades until fully activated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: robsond-config
  namespace: robson
  labels:
    app.kubernetes.io/name: robsond
    app.kubernetes.io/component: daemon
    app.kubernetes.io/part-of: robson
data:
  # Runtime environment
  ROBSON_ENV: "production"
  ROBSON_API_HOST: "0.0.0.0"
  ROBSON_API_PORT: "8080"

  # Logging
  RUST_LOG: "robsond=info,robson_engine=info,robson_exec=info,robson_store=info"

  # Market data subscription (required by daemon)
  ROBSON_MARKET_DATA_SYMBOLS: "BTCUSDT"

  # Position monitor: DISABLED for foundation deploy
  # Prevents safety net from detecting/executing on rogue positions
  ROBSON_POSITION_MONITOR_ENABLED: "true"
  ROBSON_POSITION_MONITOR_SYMBOLS: "BTCUSDT"

  # Projection worker
  PROJECTION_STREAM_KEY: "robson:daemon"
  PROJECTION_POLL_INTERVAL_MS: "500"

  # Startup stale-active handling:
  # reconcile stale Active positions on boot instead of aborting the pod.
  ROBSON_RECONCILIATION_ON_STARTUP_STALE_ACTIVE: "auto_reconcile"

  # Invalidation guard (ADR-0042): clamp the effective stop beyond the recent
  # adverse extreme (highest high for shorts / lowest low for longs, last 20
  # 15m candles incl. the forming one) so a mere retest of a recent extreme
  # does not stop out a still-valid trade. Operator-enabled 2026-07-04.
  ROBSON_STOP_INVALIDATION_GUARD_ENABLED: "true"

  # Executable-stop buffer (ADR-0041): trigger execution 10 bps beyond the
  # chosen stop level so fills avoid the obvious chart level. Priced into
  # sizing; never changes the chart-derived stop itself.
  ROBSON_STOP_BUFFER_BPS: "10"

  # CORS allow-list for the public frontend origins (FE-P1 B7).
  # Consumed by api::build_cors_layer in robsond.
  ROBSON_CORS_ALLOWED_ORIGINS: "https://robson.rbx.ia.br,https://robson.rbxsystems.ch"

  # Google OAuth login (ADR-0054, robson#196/#197). Sole allowlisted
  # operator, and the two Google Cloud Console Client IDs (rbx-systems
  # project) — Web application for the frontend's Google Identity
  # Services flow, TVs/Limited-Input for robson-cli's Device
  # Authorization Grant. Neither Client ID is secret (GIS client IDs are
  # meant to be public); the allowlisted email isn't secret either, kept
  # here rather than hardcoded per this repo's existing config style.
  ROBSON_ALLOWED_EMAIL: "ldamasio@gmail.com"
  ROBSON_GOOGLE_WEB_CLIENT_ID: "844825462148-233fhbl236qj9gu3nc7r57rf3gs6gel5.apps.googleusercontent.com"
  ROBSON_GOOGLE_CLI_CLIENT_ID: "844825462148-3nk0f2943000rev55hdj3jir1nadchev.apps.googleusercontent.com"
