# Robsond Deployment (Production)
#
# Single replica, Recreate strategy.
# robsond is the sole production runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robsond
  namespace: robson
  labels:
    app.kubernetes.io/name: robsond
    app.kubernetes.io/component: daemon
    app.kubernetes.io/part-of: robson
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: robsond
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robsond
        app.kubernetes.io/component: daemon
        app.kubernetes.io/part-of: robson
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: robsond
      imagePullSecrets:
      - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: robsond
        # Placeholder only. The real tag comes from the overlay's images
        # transformer (kustomization.yml newTag). It is deliberately a
        # tag that does NOT exist in GHCR: if the transformer is ever
        # bypassed or misconfigured, this fails closed with
        # ImagePullBackOff instead of silently running whatever :latest
        # happens to be cached on the node (imagePullPolicy is
        # IfNotPresent). A trading daemon that refuses to start is
        # recoverable; one running an unknown build is not.
        image: ghcr.io/rbxrobotica/robson-v2:sha-REPLACE_ME
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: robsond-config

        env:
        # Database (from secret)
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: robsond-secret
              key: database-url
        - name: PROJECTION_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: robsond-secret
              key: projection-tenant-id
        # Binance production credentials
        - name: ROBSON_BINANCE_API_KEY
          valueFrom:
            secretKeyRef:
              name: robsond-secret
              key: binance-api-key
        - name: ROBSON_BINANCE_API_SECRET
          valueFrom:
            secretKeyRef:
              name: robsond-secret
              key: binance-api-secret
        # API bearer token (from secret)
        - name: ROBSON_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: robsond-secret
              key: api-token
        # Funding saga feature gate (Spot→USDT→USDT-M). false → /funding/execute returns 503.
        # Enables the money-moving execute path; the actual transfer is operator-gated by the
        # type-to-confirm in the /funding UI. Set false to disable.
        - name: FUNDING_ENABLED
          value: "true"

        # Memory headroom after the OOMKill of 2026-08-18 07:24 UTC.
        #
        # robsond grew from ~50Mi to the 512Mi limit over 55h of uptime and was
        # OOMKilled with an open position. That kill was a container restart
        # in place and took 5s; a GitOps rollout is NOT the same event, because
        # strategy is Recreate and the old pod is torn down first (30s grace,
        # then scheduling, image pull and startup). The exchange insurance stop
        # is what covers either gap, per ADR-0039.
        #
        # The growth cause is not yet identified, so this is headroom, not a
        # cure: at the historical ~8.4Mi/h it buys roughly 30h beyond the old
        # ceiling, and nothing more.
        #
        # Ceiling kept at 768Mi rather than 1Gi on purpose: sumatrae already
        # runs at ~83% real memory use and its limits are 133% overcommitted.
        # A robsond that genuinely reaches 1Gi there would risk node-level
        # pressure and kubelet evictions across the namespace, which is worse
        # than one clean restart of a daemon that recovers in seconds.
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"

        # Liveness: is the process alive?
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        # Readiness: is the service ready?
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Startup: allow extra time on first boot
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
