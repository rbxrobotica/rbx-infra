# ServiceAccount for External Secrets to read plausible secrets from rbx-ia-br.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: plausible
# NOTE: the cross-namespace Role/RoleBinding that grant this SA `get` on
# plausible-secrets live in the rbx-ia-br namespace
# (apps/prod/rbx-ia-br/rbac-external-secrets-reader.yml). They are intentionally
# NOT defined here — kustomize's `namespace: plausible` override would relocate
# them into plausible, where they would grant nothing.
