# ClickHouse tuning, transcribed from plausible/community-edition@v3.2.1
# (clickhouse/logs.xml, low-resources.xml, ipv4-only.xml and
# default-profile-low-resources-overrides.xml). Upstream mounts these as
# individual files; here they are two ConfigMaps, one per drop-in directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plausible-clickhouse-config
  namespace: plausible
data:
  # Drops the log tables ClickHouse writes by default. Without this, a
  # low-traffic analytics instance spends most of its disk on its own telemetry.
  logs.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>true</console>
      </logger>
      <query_log replace="1">
        <database>system</database>
        <table>query_log</table>
        <flush_interval_milliseconds>7500</flush_interval_milliseconds>
        <engine>
          ENGINE = MergeTree
          PARTITION BY event_date
          ORDER BY (event_time)
          TTL event_date + interval 30 day
          SETTINGS ttl_only_drop_parts=1
        </engine>
      </query_log>
      <metric_log remove="remove" />
      <asynchronous_metric_log remove="remove" />
      <query_thread_log remove="remove" />
      <text_log remove="remove" />
      <trace_log remove="remove" />
      <session_log remove="remove" />
      <part_log remove="remove" />
    </clickhouse>
  # https://clickhouse.com/docs/en/operations/tips#using-less-than-16gb-of-ram
  low-resources.xml: |
    <clickhouse>
      <mark_cache_size>524288000</mark_cache_size>
    </clickhouse>
  # Upstream binds IPv4-only because Docker bridge networks have no IPv6. The
  # same applies here: the cluster pod network is IPv4-only, so leaving the
  # default `::` listener logs "Address family not supported" on every start.
  ipv4-only.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plausible-clickhouse-users
  namespace: plausible
data:
  # Caps per-query parallelism. Matches upstream's low-resource profile.
  default-profile-low-resources-overrides.xml: |
    <clickhouse>
      <profiles>
        <default>
          <max_threads>1</max_threads>
          <max_block_size>8192</max_block_size>
          <max_download_threads>1</max_download_threads>
          <input_format_parallel_parsing>0</input_format_parallel_parsing>
          <output_format_parallel_formatting>0</output_format_parallel_formatting>
        </default>
      </profiles>
    </clickhouse>
