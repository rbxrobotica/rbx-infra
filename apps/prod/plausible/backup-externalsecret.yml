# Reuse the existing private Data Lake credentials without copying any values
# into Git. Kubernetes grants access at Secret granularity; this projection
# copies only the two keys needed by the archive helper.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-backup-s3
  namespace: plausible
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: plausible-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: contabo-s3-credentials
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: contabo-s3-credentials
        property: AWS_SECRET_ACCESS_KEY
