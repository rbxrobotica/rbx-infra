# Anonymous GHCR pull verified on 2026-10-05; the overlay pins the image digest.
# Observe the first verified receipt after GitOps reconciliation before claiming
# that scheduled protection is operational.
# No decryption key is present in the cluster. Local staging is ephemeral, not
# asserted to be encrypted at rest; only the remote object is GPG-encrypted.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plausible-backup
  namespace: plausible
  labels:
    app.kubernetes.io/name: plausible-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 3 * * *"
  timeZone: America/Sao_Paulo
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: plausible-backup
        app.kubernetes.io/component: backup
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plausible-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          serviceAccountName: plausible-backup
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: jaguar
          tolerations:
            - key: robson.io/dedicated
              operator: Equal
              value: analytics
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/rbxrobotica/plausible-backup:sha-ded5a66
              imagePullPolicy: IfNotPresent
              workingDir: /app
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: plausible-secrets
                      key: DATABASE_URL
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: plausible-backup-s3
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: plausible-backup-s3
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  value: eu-central-1
                - name: S3_ARCHIVE_ENDPOINT
                  value: https://eu2.contabostorage.com
                - name: S3_ARCHIVE_BUCKET
                  value: rbx-data-lake
                - name: BACKUP_PUBLIC_KEY_FILE
                  value: /etc/plausible-backup/recipient.asc
                - name: BACKUP_RECIPIENT_FINGERPRINT
                  value: 88C7C5F7E0FB38128BAA46BC5807B2AAF43E3E41
                - name: BACKUP_STAGING_DIR
                  value: /tmp
                - name: BACKUP_MAX_BYTES
                  value: "1073741824"
                - name: BACKUP_COMMAND_TIMEOUT_SECONDS
                  value: "1800"
                - name: CLICKHOUSE_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: CLICKHOUSE_POD
                  value: plausible-clickhouse-0
                - name: CLICKHOUSE_DATABASE
                  value: plausible_events
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 512Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 5Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: staging
                  mountPath: /tmp
                - name: recipient
                  mountPath: /etc/plausible-backup
                  readOnly: true
                - name: api-access
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
          volumes:
            - name: staging
              emptyDir:
                # Disk-backed. Do not consume the node's RAM for backup data.
                sizeLimit: 4Gi
            - name: recipient
              configMap:
                name: plausible-backup-recipient
                defaultMode: 0444
            - name: api-access
              projected:
                defaultMode: 0440
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            apiVersion: v1
                            fieldPath: metadata.namespace
