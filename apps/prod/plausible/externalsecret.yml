# ExternalSecret syncs plausible-secrets from the rbx-ia-br namespace.
# The rbx-ia-br/plausible-secrets Secret must hold (see
# docs/runbooks/PLAUSIBLE-BRINGUP.md for how to create it from `pass`):
#
#   SECRET_KEY_BASE        - at least 64 bytes; `openssl rand -base64 48`
#   TOTP_VAULT_KEY         - 32 bytes base64; `openssl rand -base64 32`
#   DATABASE_URL           - postgres://plausible:<pw>@plausible-postgres:5432/plausible
#   CLICKHOUSE_DATABASE_URL - http://plausible-clickhouse:8123/plausible_events
#
# Both URLs live in the Secret rather than in plain env because they embed
# credentials (Postgres password today, ClickHouse credentials if the in-cluster
# instance ever stops being unauthenticated).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-secrets
  namespace: plausible
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: plausible-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: plausible-secrets
        property: SECRET_KEY_BASE
    - secretKey: TOTP_VAULT_KEY
      remoteRef:
        key: plausible-secrets
        property: TOTP_VAULT_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: plausible-secrets
        property: DATABASE_URL
    - secretKey: CLICKHOUSE_DATABASE_URL
      remoteRef:
        key: plausible-secrets
        property: CLICKHOUSE_DATABASE_URL
