# ExternalSecret syncs plausible-secrets from the rbx-ia-br namespace.
# The rbx-ia-br/plausible-secrets Secret must hold (see
# docs/runbooks/PLAUSIBLE-BRINGUP.md for how to create it from `pass`):
#
#   SECRET_KEY_BASE        - at least 64 bytes; `openssl rand -base64 48`
#   TOTP_VAULT_KEY         - 32 bytes base64; `openssl rand -base64 32`
#   DATABASE_URL           - postgres://plausible:<pw>@plausible-postgres:5432/plausible
#   CLICKHOUSE_DATABASE_URL - http://plausible-clickhouse:8123/plausible_events
#
# Both URLs live in the Secret rather than in plain env because they embed
# credentials (Postgres password today, ClickHouse credentials if the in-cluster
# instance ever stops being unauthenticated).
#
# POSTMARK_API_KEY is the exception: it is NOT in plausible-secrets. It is read
# straight from rbx-ia-br/rbx-contact-secrets, the Secret the contact system
# already uses, so the Postmark server token has a single home in the cluster
# and rotating it touches one place. Plausible's env var happens to be named
# POSTMARK_API_KEY while the fleet key is POSTMARK_SERVER_TOKEN; both hold the
# same Postmark *server* token for the "RBX Institutional" server.
# The cross-namespace read is granted by the read-contact-secret Role in
# apps/prod/rbx-ia-br/rbac-external-secrets-reader.yml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-secrets
  namespace: plausible
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: plausible-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: plausible-secrets
        property: SECRET_KEY_BASE
    - secretKey: TOTP_VAULT_KEY
      remoteRef:
        key: plausible-secrets
        property: TOTP_VAULT_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: plausible-secrets
        property: DATABASE_URL
    - secretKey: CLICKHOUSE_DATABASE_URL
      remoteRef:
        key: plausible-secrets
        property: CLICKHOUSE_DATABASE_URL
    - secretKey: POSTMARK_API_KEY
      remoteRef:
        key: rbx-contact-secrets
        property: POSTMARK_SERVER_TOKEN
