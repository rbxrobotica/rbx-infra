worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name initelo.com;
        root /usr/share/nginx/html;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        location = / { try_files /index.html =404; }
        location = /aula/ { try_files /aula.html =404; }
        location = /aula { return 308 /aula/; }
        location = /site.css { try_files $uri =404; }
        location = /tokens.css { try_files $uri =404; }
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / { return 404; }
    }
    server {
        listen 8080;
        server_name www.initelo.com;
        return 308 https://initelo.com$request_uri;
    }
}
