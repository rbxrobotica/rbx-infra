---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: initelo-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: initelo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: websites-initelo-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [initelo.com, www.initelo.com]
      secretName: initelo-tls
  rules:
    - host: initelo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: initelo
                port:
                  name: http
    - host: www.initelo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: initelo
                port:
                  name: http
