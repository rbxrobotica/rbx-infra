# Deployment: rbx-commerce-sandbox
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-commerce-sandbox
  namespace: rbx-commerce-sandbox
  labels:
    app.kubernetes.io/name: rbx-commerce-sandbox
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: rbx-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-commerce-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-commerce-sandbox
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/rbxrobotica/rbx-commerce
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: DATABASE_URL
            - name: COMMS_API_URL
              # Permanent fail-closed baseline. A separate approved cutover
              # may point to the isolated sandbox sink after it is ready.
              value: "http://127.0.0.1:1"
            - name: COMMS_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: COMMS_SERVICE_API_KEY
            - name: ALTCHA_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: ALTCHA_SECRET
            # Sandbox tenant must match the isolated product/BFF test tenant.
            # Never copy the production public tenant into this source Secret.
            - name: COMMERCE_PUBLIC_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: COMMERCE_PUBLIC_TENANT_ID
            - name: ASAAS_ENV
              value: "sandbox"
            - name: ASAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: ASAAS_API_KEY
            - name: ASAAS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: ASAAS_WEBHOOK_TOKEN
            - name: BTCPAY_URL
              value: "http://btcpay-server.btc-pay.svc.cluster.local:23001"
            - name: BTCPAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: BTCPAY_API_KEY
                  optional: true
            - name: PAYREXX_INSTANCE
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: PAYREXX_INSTANCE
                  optional: true
            - name: PAYREXX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-sandbox-secrets
                  key: PAYREXX_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
