# Two distinct runtime Secrets. Both values originate from the Commerce
# sandbox source Secret in rbx-ia-br; neither is shared with production Comms.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: satwake-email-sink-service-key
  namespace: rbx-commerce-sandbox
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: satwake-email-sink-service-key
    creationPolicy: Owner
  data:
    - secretKey: SATWAKE_EMAIL_SINK_SERVICE_KEY
      remoteRef:
        key: rbx-commerce-sandbox-secrets
        property: COMMS_SERVICE_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: satwake-email-sink-operator-key
  namespace: rbx-commerce-sandbox
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: satwake-email-sink-operator-key
    creationPolicy: Owner
  data:
    - secretKey: SATWAKE_EMAIL_SINK_OPERATOR_KEY
      remoteRef:
        key: rbx-commerce-sandbox-secrets
        property: SATWAKE_EMAIL_SINK_OPERATOR_KEY
