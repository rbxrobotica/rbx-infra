apiVersion: apps/v1
kind: Deployment
metadata:
  name: kulinaryos-institutional
  namespace: kulinaryos
  labels:
    app.kubernetes.io/name: kulinaryos-institutional
    app.kubernetes.io/component: institutional-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kulinaryos-institutional
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kulinaryos-institutional
        app.kubernetes.io/component: institutional-site
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kulinaryos-institutional
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/rbxrobotica/kulinaryos-institutional:sha-247abc83810bac21e8fa6fb3f68c68297d854eed
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 150m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kulinaryos-institutional
  namespace: kulinaryos
  labels:
    app.kubernetes.io/name: kulinaryos-institutional
    app.kubernetes.io/component: institutional-site
spec:
  selector:
    app.kubernetes.io/name: kulinaryos-institutional
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
