apiVersion: apps/v1
kind: Deployment
metadata:
  name: kulinaryos-institutional
  namespace: kulinaryos
  labels:
    app.kubernetes.io/name: kulinaryos-institutional
    app.kubernetes.io/component: institutional-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kulinaryos-institutional
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kulinaryos-institutional
        app.kubernetes.io/component: institutional-site
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kulinaryos-institutional
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/rbxrobotica/kulinaryos-institutional:sha-d06b3cd26ded833545610a2bbfd3227d31a50178
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONTABO_S3_ENDPOINT
              value: https://eu2.contabostorage.com
            - name: CONTABO_S3_CONTENT_BUCKET
              value: rbx-content
            - name: KULINARYOS_CONTENT_PREFIX
              value: kulinaryos/institutional
            - name: CONTENT_CACHE_TTL_SECONDS
              value: "60"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: contabo-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: contabo-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kulinaryos-institutional
  namespace: kulinaryos
  labels:
    app.kubernetes.io/name: kulinaryos-institutional
    app.kubernetes.io/component: institutional-site
spec:
  selector:
    app.kubernetes.io/name: kulinaryos-institutional
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
