apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-relay-nginx
  namespace: kulinaryos-v1
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {}

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;

      upstream wordpress_origin {
        server 78.47.113.97:443;
        keepalive 16;
      }

      server {
        listen 8080;

        location = /healthz {
          access_log off;
          return 200 "ok\n";
        }

        location / {
          proxy_pass https://wordpress_origin;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_ssl_server_name on;
          proxy_ssl_name kulinaryos.com;
          proxy_ssl_verify off;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-relay-nginx
  namespace: kulinaryos-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress-relay-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-relay-nginx
        app.kubernetes.io/component: emergency-origin-relay
    spec:
      nodeSelector:
        kubernetes.io/hostname: jaguar
      tolerations:
        - key: robson.io/dedicated
          operator: Equal
          value: analytics
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          imagePullPolicy: IfNotPresent
          command:
            - nginx
          args:
            - -g
            - daemon off;
            - -c
            - /etc/nginx-relay/nginx.conf
          ports:
            - name: http-relay
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-relay
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-relay
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: config
              mountPath: /etc/nginx-relay
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: wordpress-relay-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-relay-nginx
  namespace: kulinaryos-v1
spec:
  selector:
    app.kubernetes.io/name: wordpress-relay-nginx
  ports:
    - name: http
      port: 80
      targetPort: http-relay
      protocol: TCP
