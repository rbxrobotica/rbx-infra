apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kulinaryos-com-tls
  namespace: kulinaryos-v1
spec:
  dnsNames:
    - kulinaryos.com
    - www.kulinaryos.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: kulinaryos-com-tls
  usages:
    - digital signature
    - key encipherment
