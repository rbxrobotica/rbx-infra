# Stage 1: prepare a separate credential mirror without changing the running
# Commerce Deployment or its existing broad Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-commerce-consumption-key
  namespace: rbx-commerce
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-commerce-consumption-key
    creationPolicy: Owner
  data:
    - secretKey: COMMERCE_CONSUMPTION_SERVICE_KEY
      remoteRef:
        key: rbx-commerce-consumption-key
        property: COMMERCE_CONSUMPTION_SERVICE_KEY
