# ExternalSecret syncs rbx-commerce-secrets from rbx-ia-br namespace
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-commerce-secrets
  namespace: rbx-commerce
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-commerce-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: rbx-commerce-secrets
        property: DATABASE_URL
    - secretKey: COMMS_API_URL
      remoteRef:
        key: rbx-commerce-secrets
        property: COMMS_API_URL
    - secretKey: ASAAS_API_KEY
      remoteRef:
        key: rbx-commerce-secrets
        property: ASAAS_API_KEY
    - secretKey: ASAAS_WEBHOOK_TOKEN
      remoteRef:
        key: rbx-commerce-secrets
        property: ASAAS_WEBHOOK_TOKEN
    - secretKey: COMMERCE_SERVICE_KEY
      remoteRef:
        key: rbx-commerce-secrets
        property: COMMERCE_SERVICE_KEY
    - secretKey: ALTCHA_SECRET
      remoteRef:
        key: rbx-commerce-secrets
        property: ALTCHA_SECRET
    # Payment provider credentials for USD plans. The k8s-secrets role writes
    # these keys even when the pass entries are still empty, so the sync never
    # breaks; rbx-commerce treats an empty value as "provider not configured".
    - secretKey: BTCPAY_API_KEY
      remoteRef:
        key: rbx-commerce-secrets
        property: BTCPAY_API_KEY
    - secretKey: BTCPAY_STORE_ID
      remoteRef:
        key: rbx-commerce-secrets
        property: BTCPAY_STORE_ID
    - secretKey: BTCPAY_WEBHOOK_SECRET
      remoteRef:
        key: rbx-commerce-secrets
        property: BTCPAY_WEBHOOK_SECRET
    - secretKey: PAYREXX_INSTANCE
      remoteRef:
        key: rbx-commerce-secrets
        property: PAYREXX_INSTANCE
    - secretKey: PAYREXX_API_KEY
      remoteRef:
        key: rbx-commerce-secrets
        property: PAYREXX_API_KEY
    - secretKey: PAYREXX_WEBHOOK_SECRET
      remoteRef:
        key: rbx-commerce-secrets
        property: PAYREXX_WEBHOOK_SECRET
