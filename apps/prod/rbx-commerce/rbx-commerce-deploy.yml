# Deployment: rbx-commerce
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-commerce
  namespace: rbx-commerce
  labels:
    app.kubernetes.io/name: rbx-commerce
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: rbx-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-commerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-commerce
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/rbxrobotica/rbx-commerce
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: DATABASE_URL
            - name: COMMS_API_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: COMMS_API_URL
            # Payment provider configuration (ADR-0009)
            - name: ASAAS_ENV
              value: "production"
            - name: ASAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: ASAAS_API_KEY
                  optional: false
            - name: ASAAS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: ASAAS_WEBHOOK_TOKEN
                  optional: true
            # BTCPay Server lives in rbx-payments (apps/prod/rbx-payments); the
            # Greenfield API listens on 23000. Store id, API key and webhook
            # secret are issued by the operator in the BTCPay UI; until they
            # exist USD checkouts fall back to provisioning=manual.
            - name: BTCPAY_URL
              value: "http://rbx-btcpay-server.rbx-payments.svc.cluster.local:23000"
            - name: BTCPAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: BTCPAY_API_KEY
                  optional: true
            - name: BTCPAY_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: BTCPAY_STORE_ID
                  optional: true
            - name: BTCPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: BTCPAY_WEBHOOK_SECRET
                  optional: true
            - name: BTCPAY_RETURN_URL
              value: "https://app.merovelis.com/briefing-btc/account"
            - name: PAYREXX_INSTANCE
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: PAYREXX_INSTANCE
                  optional: true
            - name: PAYREXX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: PAYREXX_API_KEY
                  optional: true
            - name: PAYREXX_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: PAYREXX_WEBHOOK_SECRET
                  optional: true
            - name: PAYREXX_RETURN_URL
              value: "https://app.merovelis.com/briefing-btc/account"
            # Tenant the public checkout writes under. Not a secret: uuid5 of the
            # Strategos machine user, the same value rbx-console keeps in
            # rbx/console/users-access/tenant-id and the session BFFs resolve.
            # Without it commerce falls back to the zero UUID, which the portal
            # and /api/entitlements/access never see (rbx-commerce migration
            # 000018 moved the rows written that way).
            - name: COMMERCE_PUBLIC_TENANT_ID
              value: "885f24d2-1217-534e-bb1b-53440a3c04bb"
            - name: COMMERCE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: COMMERCE_SERVICE_KEY
            # Public checkout anti-abuse (internal/checkout). optional=true so this
            # manifest can merge ahead of the pass/k8s-secrets sync — until the key
            # exists, the public checkout endpoints 503 rather than crash the pod.
            - name: ALTCHA_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-commerce-secrets
                  key: ALTCHA_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
