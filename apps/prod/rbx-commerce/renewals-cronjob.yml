# Commerce-owned renewals for USD subscriptions (BTCPay Server has no recurring
# billing). Once a day this asks rbx-commerce to create the next invoice for
# every active BTCPay subscription whose period ends within seven days; the
# customer notification with the payment link is owned by rbx-comms
# (subscription.renewal_invoice_created event). See rbx-commerce docs/api.md,
# "POST /api/v1/subscriptions/renewals/run".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rbx-commerce-renewals
  namespace: rbx-commerce
  labels:
    app.kubernetes.io/name: rbx-commerce-renewals
    app.kubernetes.io/part-of: rbx-commerce
spec:
  schedule: "10 6 * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rbx-commerce-renewals
            app.kubernetes.io/part-of: rbx-commerce
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renewals
              image: curlimages/curl:8.14.1
              imagePullPolicy: IfNotPresent
              env:
                - name: COMMERCE_SERVICE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rbx-commerce-secrets
                      key: COMMERCE_SERVICE_KEY
              command:
                - sh
                - -ec
                - >-
                  curl --fail --silent --show-error --max-time 120
                  -X POST
                  -H "Authorization: Bearer $COMMERCE_SERVICE_KEY"
                  "http://rbx-commerce.rbx-commerce.svc.cluster.local/api/v1/subscriptions/renewals/run?days=7"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
