# rbx-flightdeck production bootstrap Job
#
# ArgoCD Sync hook after migration (wave 2, before the Deployment at wave 3):
# idempotently ensures the real
# missions (Swiss Outreach, Robson Weekly Review), the operator's explicit
# mission_access, active policy v1 and Swiss channels/capacity. Creates no
# demo content; capacity amounts are starting values the operator adjusts in
# the UI. Safe to re-run on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: rbx-flightdeck-db-bootstrap
  namespace: rbx-flightdeck
  labels:
    app.kubernetes.io/name: rbx-flightdeck
    app.kubernetes.io/component: db-bootstrap
    app.kubernetes.io/part-of: rbx-flightdeck
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-flightdeck
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bootstrap
          image: ghcr.io/rbxrobotica/rbx-flightdeck
          imagePullPolicy: IfNotPresent
          command:
            - node
            - scripts/bootstrap-prod.js
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # node UID in docker-node images. Required: containerd reports the
            # image USER as a username and kubelet rejects runAsNonRoot without
            # a numeric UID (CreateContainerConfigError otherwise).
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: DATABASE_URL
            - name: FLIGHTDECK_OPERATOR_EMAIL
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: FLIGHTDECK_OPERATOR_EMAIL
            - name: FLIGHTDECK_OPERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: FLIGHTDECK_OPERATOR_NAME
            # The bootstrap refuses to run when the operator email is not in
            # the login allowlist (otherwise mission access could be granted
            # to an identity that can never authenticate).
            - name: OIDC_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_ALLOWED_EMAILS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
