# rbx-flightdeck: SvelteKit (adapter-node) — weekly mission planning with a
# human approval gate. Auth in-app: ZITADEL OIDC (code flow + PKCE) plus an
# explicit email allowlist; the server fails closed at startup when the oidc
# configuration is incomplete.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-flightdeck
  namespace: rbx-flightdeck
  labels:
    app.kubernetes.io/name: rbx-flightdeck
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: rbx-flightdeck
  annotations:
    # after dependencies (0), migrate (1) and bootstrap (2)
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-flightdeck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-flightdeck
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/rbxrobotica/rbx-flightdeck
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # node UID in docker-node images. Required: containerd reports the
            # image USER as a username and kubelet rejects runAsNonRoot without
            # a numeric UID (CreateContainerConfigError otherwise).
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: ORIGIN
              value: "https://flightdeck.rbxsystems.ch"
            - name: AUTH_MODE
              value: "oidc"
            - name: OIDC_REDIRECT_URI
              value: "https://flightdeck.rbxsystems.ch/auth/callback"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: DATABASE_URL
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_ISSUER
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: SESSION_SECRET
            # The allowlist is read per request from a mounted Secret volume
            # (kubelet refreshes it), so removing an email revokes access to
            # live pods within the ExternalSecret refresh (15m) + kubelet sync
            # window, without a rollout. Env vars would freeze at pod start.
            - name: OIDC_ALLOWED_EMAILS_FILE
              value: /etc/rbx-flightdeck/allowed-emails
          volumeMounts:
            - name: allowlist
              mountPath: /etc/rbx-flightdeck
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
      volumes:
        - name: allowlist
          secret:
            secretName: rbx-flightdeck-secrets
            items:
              - key: OIDC_ALLOWED_EMAILS
                path: allowed-emails
