# rbx-flightdeck: SvelteKit (adapter-node) — weekly mission planning with a
# human approval gate. Auth in-app: ZITADEL OIDC (code flow + PKCE) plus an
# explicit email allowlist; the server fails closed at startup when the oidc
# configuration is incomplete.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-flightdeck
  namespace: rbx-flightdeck
  labels:
    app.kubernetes.io/name: rbx-flightdeck
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: rbx-flightdeck
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-flightdeck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-flightdeck
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/rbxrobotica/rbx-flightdeck
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: ORIGIN
              value: "https://flightdeck.rbxsystems.ch"
            - name: AUTH_MODE
              value: "oidc"
            - name: OIDC_REDIRECT_URI
              value: "https://flightdeck.rbxsystems.ch/auth/callback"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: DATABASE_URL
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_ISSUER
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: SESSION_SECRET
            - name: OIDC_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_ALLOWED_EMAILS
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
