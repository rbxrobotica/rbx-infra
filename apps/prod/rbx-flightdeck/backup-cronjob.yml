# Published main-only image and owner-host PostgreSQL recovery were verified.
# Receipts/download/restore are verified; scheduled attempts remain observable.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rbx-flightdeck-backup
  namespace: rbx-flightdeck
  labels:
    app.kubernetes.io/name: rbx-flightdeck-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "45 3 * * *"
  timeZone: America/Sao_Paulo
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1860
      # Retry transient archive failures serially within the existing deadline.
      # Privacy, versioning and readback gates stay fail-closed on every attempt.
      backoffLimit: 2
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rbx-flightdeck-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          serviceAccountName: rbx-flightdeck-backup
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Use application nodes with proven PostgreSQL access. Jaguar's
          # local pod traffic is rejected by the database's existing HBA.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [tiger, altaica]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/rbxrobotica/comms-backup:sha-b3ddae8@sha256:3f5ddf6636672be688670d9fe9361697cd73a24775c264f02a30e51f96297248
              imagePullPolicy: IfNotPresent
              command: ["python3", "/app/flightdeck/backup_runner.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: rbx-flightdeck-secrets
                      key: DATABASE_URL
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: contabo-s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: contabo-s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  value: eu-central-1
                - name: S3_ARCHIVE_ENDPOINT
                  value: https://eu2.contabostorage.com
                - name: S3_ARCHIVE_BUCKET
                  value: rbx-data-lake
                - name: BACKUP_PUBLIC_KEY_FILE
                  value: /etc/flightdeck-backup/recipient.asc
                - name: BACKUP_RECIPIENT_FINGERPRINT
                  value: 88C7C5F7E0FB38128BAA46BC5807B2AAF43E3E41
                - name: BACKUP_STAGING_DIR
                  value: /tmp
                - name: BACKUP_MAX_BYTES
                  value: "67108864"
                - name: BACKUP_TIMEOUT_SECONDS
                  value: "1800"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: staging
                  mountPath: /tmp
                - name: recipient
                  mountPath: /etc/flightdeck-backup
                  readOnly: true
          volumes:
            - name: staging
              emptyDir:
                # Plaintext exists only in bounded RAM. No private key in cluster.
                medium: Memory
                sizeLimit: 256Mi
            - name: recipient
              configMap:
                name: rbx-flightdeck-backup-recipient
                defaultMode: 0444
