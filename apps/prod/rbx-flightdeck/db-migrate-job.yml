# rbx-flightdeck DB migration Job
#
# ArgoCD Sync hook: runs before the Deployment wave on every sync. Safe to
# re-run: scripts/migrate.js applies migrations/*.sql exactly once each
# (schema_migrations bookkeeping). Against the jaguar database the disposable
# marker logic is inert by design (non-disposable URL tuple).
apiVersion: batch/v1
kind: Job
metadata:
  name: rbx-flightdeck-db-migrate
  namespace: rbx-flightdeck
  labels:
    app.kubernetes.io/name: rbx-flightdeck
    app.kubernetes.io/component: db-migrate
    app.kubernetes.io/part-of: rbx-flightdeck
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-flightdeck
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: ghcr.io/rbxrobotica/rbx-flightdeck
          imagePullPolicy: IfNotPresent
          command:
            - node
            - scripts/migrate.js
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
