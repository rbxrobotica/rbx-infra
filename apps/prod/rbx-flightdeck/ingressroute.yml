# IngressRoute: Flight Deck (flightdeck.rbxsystems.ch) → rbx-flightdeck.
# DNS: flightdeck.rbxsystems.ch is managed by PowerDNS/OpenTofu (infra/terraform/dns).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rbx-flightdeck
  namespace: rbx-flightdeck
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # HTTP → HTTPS redirect
    - match: Host(`flightdeck.rbxsystems.ch`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-https
          namespace: rbx-flightdeck
      services:
        - name: rbx-flightdeck
          port: 80
    # HTTPS traffic → SvelteKit node server (auth handled in-app: OIDC + allowlist)
    - match: Host(`flightdeck.rbxsystems.ch`)
      kind: Rule
      priority: 10
      services:
        - name: rbx-flightdeck
          port: 80
  tls:
    secretName: rbx-flightdeck-tls
