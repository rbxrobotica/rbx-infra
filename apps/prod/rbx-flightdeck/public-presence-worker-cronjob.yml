# Flight Deck Public Presence outbox worker trigger (rbx-flightdeck ADR 0010,
# strategos-core ADR-0010 §11). The worker endpoint is a purpose-specific
# one-shot stage: each POST delivers at most one pending source event to
# Public Presence, or admits at most one blocked execution request in Maestro,
# and returns {"stage": "idle"} when there is nothing to do. Nothing here
# activates a mission or publishes anything. Until this CronJob existed the
# endpoint had no caller and the chain never started (verified 2026-09-23).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rbx-flightdeck-public-presence-worker
  namespace: rbx-flightdeck
  labels:
    app.kubernetes.io/name: rbx-flightdeck-public-presence-worker
    app.kubernetes.io/part-of: rbx-flightdeck
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 120
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rbx-flightdeck-public-presence-worker
            app.kubernetes.io/part-of: rbx-flightdeck
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: curlimages/curl:8.14.1
              imagePullPolicy: IfNotPresent
              env:
                - name: PUBLIC_PRESENCE_WORKER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rbx-flightdeck-secrets
                      key: PUBLIC_PRESENCE_WORKER_KEY
              command:
                - sh
                - -ec
                - >-
                  curl --fail --silent --show-error --max-time 240
                  -X POST
                  -H "Authorization: Bearer $PUBLIC_PRESENCE_WORKER_KEY"
                  "http://rbx-flightdeck.rbx-flightdeck.svc.cluster.local/internal/workers/public-presence"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
