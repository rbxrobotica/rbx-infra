# Provision the private pilot connector after migration and owner bootstrap.
apiVersion: batch/v1
kind: Job
metadata:
  name: rbx-flightdeck-intake-bootstrap
  namespace: rbx-flightdeck
  labels:
    app.kubernetes.io/name: rbx-flightdeck
    app.kubernetes.io/component: intake-bootstrap
    app.kubernetes.io/part-of: rbx-flightdeck
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-flightdeck
        app.kubernetes.io/component: intake-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bootstrap
          image: ghcr.io/rbxrobotica/rbx-flightdeck
          imagePullPolicy: IfNotPresent
          command:
            - node
            - scripts/intake/bootstrap.js
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # node UID in docker-node images. Required: containerd reports the
            # image USER as a username and kubelet rejects runAsNonRoot without
            # a numeric UID (CreateContainerConfigError otherwise).
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: DATABASE_URL
            - name: FLIGHTDECK_OPERATOR_EMAIL
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: FLIGHTDECK_OPERATOR_EMAIL
            - name: FLIGHTDECK_OPERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: FLIGHTDECK_OPERATOR_NAME
            # The bootstrap refuses to run when the operator email is not in
            # the login allowlist (otherwise mission access could be granted
            # to an identity that can never authenticate).
            - name: OIDC_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: OIDC_ALLOWED_EMAILS
            - name: INTAKE_CHAT_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: rbx-flightdeck-secrets
                  key: INTAKE_CHAT_TOKEN_SHA256
            - name: INTAKE_CHAT_THREAD_ID
              value: 01a10ca9-7666-7620-84a3-e012932095cc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
