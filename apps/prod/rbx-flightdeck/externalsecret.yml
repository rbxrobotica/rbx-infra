# ExternalSecret syncs rbx-flightdeck-secrets from rbx-ia-br.
# The rbx-ia-br/rbx-flightdeck-secrets Secret must hold (pass = source of
# truth, entries under rbx/flightdeck/):
#   DATABASE_URL              - postgres://flightdeck:<pw>@rbx-flightdeck-postgres:5432/flightdeck?sslmode=disable
#   OIDC_ISSUER               - https://auth.rbx.ia.br (primary ZITADEL)
#   OIDC_CLIENT_ID            - ZITADEL client id for Flight Deck (confidential)
#   OIDC_CLIENT_SECRET        - ZITADEL client secret
#   SESSION_SECRET            - 32+ random bytes; seals the session cookie
#   OIDC_ALLOWED_EMAILS       - comma-separated allowlist (empty admits nobody)
#   FLIGHTDECK_OPERATOR_EMAIL - operator identity for the DB bootstrap
#   FLIGHTDECK_OPERATOR_NAME  - operator display name for the DB bootstrap
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rbx-flightdeck-secrets
  namespace: rbx-flightdeck
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: rbx-flightdeck-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: rbx-flightdeck-secrets
        property: DATABASE_URL
    - secretKey: OIDC_ISSUER
      remoteRef:
        key: rbx-flightdeck-secrets
        property: OIDC_ISSUER
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: rbx-flightdeck-secrets
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: rbx-flightdeck-secrets
        property: OIDC_CLIENT_SECRET
    - secretKey: SESSION_SECRET
      remoteRef:
        key: rbx-flightdeck-secrets
        property: SESSION_SECRET
    - secretKey: OIDC_ALLOWED_EMAILS
      remoteRef:
        key: rbx-flightdeck-secrets
        property: OIDC_ALLOWED_EMAILS
    - secretKey: FLIGHTDECK_OPERATOR_EMAIL
      remoteRef:
        key: rbx-flightdeck-secrets
        property: FLIGHTDECK_OPERATOR_EMAIL
    - secretKey: FLIGHTDECK_OPERATOR_NAME
      remoteRef:
        key: rbx-flightdeck-secrets
        property: FLIGHTDECK_OPERATOR_NAME
