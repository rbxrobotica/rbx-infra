apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rbx-flightdeck

resources:
  - namespace.yml
  - rbac-external-secrets.yml
  - secretstore.yml
  - externalsecret.yml
  - middleware.yml
  - certificate.yml
  - ingressroute.yml
  - postgres-svc.yml
  - deploy.yml
  - svc.yml
  - db-migrate-job.yml
  - db-bootstrap-job.yml

labels:
  - pairs:
      app.kubernetes.io/part-of: rbx-flightdeck
      environment: production
    includeSelectors: false

images:
  # Promoted by rbx-flightdeck CI on each main build (sha-<commit>; fleet
  # standard, docs/infra/IMAGE-PROMOTION.md). Initial pin: deploy-branch
  # build, verified to exist in GHCR before this PR.
  - name: ghcr.io/rbxrobotica/rbx-flightdeck
    newTag: sha-70ec20aa815e5ce120357c2e25887ba263b16e18
