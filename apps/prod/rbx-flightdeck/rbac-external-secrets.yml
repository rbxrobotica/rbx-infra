# ServiceAccount for External Secrets to read Flight Deck secrets from rbx-ia-br.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: rbx-flightdeck
# NOTE: the cross-namespace Role/RoleBinding that grant this SA `get` on
# rbx-flightdeck-secrets live in the rbx-ia-br namespace
# (apps/prod/rbx-ia-br/rbac-external-secrets-reader.yml). They are intentionally
# NOT defined here — kustomize's `namespace: rbx-flightdeck` override would
# relocate them into rbx-flightdeck, where they would grant nothing.
