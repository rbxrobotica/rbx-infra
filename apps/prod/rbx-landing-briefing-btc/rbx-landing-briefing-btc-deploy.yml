# Isolated Briefing BTC landing deployment (static site, nginx-unprivileged).
# Image published by rbxrobotica/rbx-landing-briefing-btc CI (Pattern R:
# org registry; tag in kustomization.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbx-landing-briefing-btc
  namespace: rbx-landing-briefing-btc
  labels:
    app.kubernetes.io/name: rbx-landing-briefing-btc
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rbx-landing-briefing-btc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbx-landing-briefing-btc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbx-landing-briefing-btc
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: rbx-landing-briefing-btc
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: rbx-landing-briefing-btc
          # Image name only — tag injected by kustomization.yml (images transformer),
          # promoted by the app repo CI (RBX_INFRA_PAT self-push).
          image: ghcr.io/rbxrobotica/rbx-landing-briefing-btc
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
