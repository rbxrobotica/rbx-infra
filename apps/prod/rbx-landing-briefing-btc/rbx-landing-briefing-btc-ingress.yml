# Isolated Briefing BTC landing ingress (briefingbtc.merovelis.com).
# DNS record codified in infra/terraform/dns/merovelis.com.tf (A -> k3s
# ingress IP). TLS via cert-manager (letsencrypt-prod, HTTP-01).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rbx-landing-briefing-btc
  namespace: rbx-landing-briefing-btc
  labels:
    app.kubernetes.io/name: rbx-landing-briefing-btc
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rbx-landing-briefing-btc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: rbx-landing-briefing-btc-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - briefingbtc.merovelis.com
      secretName: rbx-landing-briefing-btc-tls
  rules:
    - host: briefingbtc.merovelis.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rbx-landing-briefing-btc
                port:
                  number: 80
