# One landing service for the preserved Briefing BTC host and Satwake brand.
# Spec: rbx-growth marketing/2026-h2-growth/landing-pages/briefing-btc-isolated-lp.md
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - middleware-https.yml
  - rbx-landing-briefing-btc-deploy.yml
  - rbx-landing-briefing-btc-svc.yml
  - rbx-landing-briefing-btc-ingress.yml
  - rbx-landing-satwake-ingress.yml
labels:
  - pairs:
      app.kubernetes.io/part-of: rbx-landing-briefing-btc
      environment: production
    includeSelectors: false
images:
  # Promote a reviewed app image in a separate Infra change before syncing.
  # Currently pinned to the pre-Satwake bootstrap image.
  - name: ghcr.io/rbxrobotica/rbx-landing-briefing-btc
    newTag: sha-8a02318
