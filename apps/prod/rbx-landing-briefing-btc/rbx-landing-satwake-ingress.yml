# Satwake brand host, served by the existing landing service after its Satwake
# image is promoted. The campaign host remains a draft and is not routed here.
# DNS is currently external to this PowerDNS Terraform tree; see the cutover
# runbook before syncing this desired state.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rbx-landing-satwake
  namespace: rbx-landing-briefing-btc
  labels:
    app.kubernetes.io/name: rbx-landing-briefing-btc
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rbx-landing-briefing-btc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: rbx-landing-briefing-btc-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - satwake.com
        - www.satwake.com
      secretName: rbx-landing-satwake-tls
  rules:
    - host: satwake.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rbx-landing-briefing-btc
                port:
                  number: 80
    - host: www.satwake.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rbx-landing-briefing-btc
                port:
                  number: 80
