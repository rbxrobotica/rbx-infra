# Pulls OIDC_CLIENT_SECRET and SESSION_SECRET from the rbx-ia-br source secret
# named eden-outbox-secrets. Operator creates that source secret (via pass).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eden-outbox-secrets
  namespace: eden-outbox
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: eden-outbox-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: eden-outbox-secrets
        property: OIDC_CLIENT_SECRET
    - secretKey: SESSION_SECRET
      remoteRef:
        key: eden-outbox-secrets
        property: SESSION_SECRET
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: eden-outbox-secrets
        property: GITHUB_TOKEN
