# Traefik IngressRoute for the portal. Hosts: outbox.rbxsystems.ch + outbox.rbx.ia.br.
# DNS is an operator step (pdns); see docs/DEPLOY-CHECKLIST.md.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: eden-outbox
  namespace: eden-outbox
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`outbox.rbxsystems.ch`) || Host(`outbox.rbx.ia.br`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-https
          namespace: eden-outbox
      services:
        - name: eden-outbox
          port: 80
    - match: Host(`outbox.rbxsystems.ch`) || Host(`outbox.rbx.ia.br`)
      kind: Rule
      priority: 10
      services:
        - name: eden-outbox
          port: 80
  tls:
    secretName: eden-outbox-tls
