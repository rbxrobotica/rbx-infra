apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: olhaescola-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: olhaescola
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: olhaescola-olhaescola-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - olhaescola.com.br
    secretName: olhaescola-tls
  rules:
  - host: olhaescola.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: olhaescola-web
            port:
              number: 80
