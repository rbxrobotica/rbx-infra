apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: personal-research
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-personal-research
  namespace: rbx-ia-br
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [personal-research-runtime, personal-research-registry]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-personal-research
  namespace: rbx-ia-br
subjects:
  - kind: ServiceAccount
    name: external-secrets-reader
    namespace: personal-research
roleRef:
  kind: Role
  name: read-personal-research
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes-store
  namespace: personal-research
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-secrets-reader
      remoteNamespace: rbx-ia-br
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
        url: https://kubernetes.default.svc.cluster.local
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runtime
  namespace: personal-research
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: runtime
    creationPolicy: Owner
  data:
    - secretKey: CAREER_DATABASE_URL
      remoteRef:
        key: personal-research-runtime
        property: CAREER_DATABASE_URL
    - secretKey: PG_CA_PEM
      remoteRef:
        key: personal-research-runtime
        property: PG_CA_PEM
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: personal-research
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: personal-research-registry
        property: .dockerconfigjson
