name: rbx-znc

services:
  znc:
    image: ${ZNC_IMAGE:-lscr.io/linuxserver/znc:latest}
    container_name: rbx-znc
    env_file:
      - .env
    volumes:
      - ${ZNC_CONFIG_DIR:-/srv/rbx/irc/znc/config}:/config
    ports:
      - "127.0.0.1:${ZNC_PORT:-6501}:6501/tcp"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
