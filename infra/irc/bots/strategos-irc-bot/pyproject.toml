[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "strategos-irc-bot"
version = "0.1.0"
description = "Read-only RBX Strategos IRC adapter"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
strategos-irc-bot = "strategos_irc_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
