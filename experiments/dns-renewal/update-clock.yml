---
- name: Replace only the failed D-Bus clock query with a read-only kernel query
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require explicit reviewed source
      ansible.builtin.assert:
        that: [renewal_source is defined]
    - name: Atomically install only the two reviewed public program files
      ansible.builtin.copy:
        src: '{{ renewal_source }}/{{ item }}'
        dest: '/opt/rbx-dns-renewal/{{ item }}'
        owner: root
        group: root
        mode: '0444'
      loop: [clock_status.py, renewer.py]
