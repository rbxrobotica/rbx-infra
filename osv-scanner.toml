# Known vulnerabilities that scripts/scan-repository.sh does not fail on, each
# until the date it names. From that date the scan fails on it again. The file
# is passed to osv-scanner with --config, so an entry applies to every
# lockfile of the repository, not only to the one that has the finding today.
#
# All three entries are go.opentelemetry.io/otel 1.41.0 and
# go.opentelemetry.io/otel/trace 1.41.0, indirect dependencies of the kubectl
# build in scripts/plausible/kubectl/go.mod, as found on main at f609e74 on
# 2026-11-28. Both modules are fixed in 1.47.0. Updating them changes the
# Plausible backup image and belongs to a change that builds and scans that
# image, not to the one that added this scan.

[[IgnoredVulns]]
id = "GO-2026-5158"
ignoreUntil = 2026-12-28T00:00:00Z
reason = "CVE-2026-41178: baggage parsing does not cap the raw header length. scripts/plausible/kubectl/go.mod, fixed in otel 1.42.0."

[[IgnoredVulns]]
id = "GO-2026-6975"
ignoreUntil = 2026-12-28T00:00:00Z
reason = "CVE-2026-128086: memory allocation amplification in W3C baggage parsing. scripts/plausible/kubectl/go.mod, fixed in otel 1.47.0."

[[IgnoredVulns]]
id = "GO-2026-6974"
ignoreUntil = 2026-12-28T00:00:00Z
reason = "CVE-2026-128085: AttributeValueLengthLimit bypass through U+FFFD runes. scripts/plausible/kubectl/go.mod, fixed in otel/trace 1.47.0."
