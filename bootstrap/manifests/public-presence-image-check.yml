---
# Ephemeral, read-only image probe. Not a migration or an application rollout.
# Create once during the held recovery and reconcile its returned Job identity.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: rbx-public-presence-image-check-
  namespace: rbx-public-presence
  labels:
    app.kubernetes.io/part-of: rbx-public-presence
    app.kubernetes.io/component: image-check
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: doctrine-check
          image: ghcr.io/rbxrobotica/rbx-public-presence-api:sha-8643b56486cae9c3fed1e385d35d4cd912591a81@sha256:d12b9b199b89c91eb2535b56d4c57a78260526bd0eca5a1a06746c4781c629ea
          imagePullPolicy: Always
          args: [doctrine-check]
          env:
            - name: PRESENCE_DOCTRINE_DIR
              value: /doctrine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
