---
# Tailscale client for the RBX headscale mesh (ADR-0011). Additive: adds a
# WireGuard interface next to existing connectivity. Closes nothing, changes
# no route, never touches resolv.conf (--accept-dns=false).

- name: Install tailscale apt signing key
  get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ tailscale_apt_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add tailscale apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ tailscale_apt_release }} main"
    filename: tailscale
    state: present

- name: Install pinned tailscale
  apt:
    name: "tailscale={{ tailscale_version }}"
    update_cache: true
    allow_downgrade: true

- name: Hold tailscale package (upgrades are deliberate PRs)
  dpkg_selections:
    name: tailscale
    selection: hold

- name: Allow WireGuard port on UFW (direct node-to-node paths)
  ufw:
    rule: allow
    port: "41641"
    proto: udp
    comment: "tailscale wireguard (ADR-0011)"

- name: Enable and start tailscaled
  systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read current backend state
  command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false

- name: Join the mesh (only when an auth key was passed and not yet joined)
  command: >
    tailscale up
    --login-server={{ tailscale_login_server }}
    --accept-dns=false
    --accept-routes=false
    --authkey={{ tailscale_authkey }}
  when:
    - tailscale_authkey | length > 0
    - (tailscale_status_raw.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'
  no_log: true

- name: Report mesh state (never fails; enrollment is a human-gated step)
  debug:
    msg: "tailscaled BackendState: {{ (tailscale_status_raw.stdout | default('{}', true) | from_json).BackendState | default('unknown') }}"
