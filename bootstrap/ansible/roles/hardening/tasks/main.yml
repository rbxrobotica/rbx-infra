---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install security packages
  apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

# Kept in its own file so harden-ssh.yml can roll the access policy
# out one host at a time without the ufw reset below.
# import_tasks, not include_tasks: only a static import propagates the tag to
# the tasks inside the file. With a dynamic include, `--tags sshd` resolves the
# include and then skips every task in it.
- name: Apply sshd access policy
  ansible.builtin.import_tasks: sshd.yml
  tags: [sshd]

- name: Reset ufw to defaults
  ufw:
    state: reset

- name: Allow SSH
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow kubectl access only from your machine
  ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ kubectl_allowed_ips }}"
  when: inventory_hostname in groups['k3s_server']

- name: Allow HTTP (Traefik — k3s nodes only)
  ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: inventory_hostname in (groups.get('k3s_server', []) + groups.get('k3s_agents', []))

- name: Allow HTTPS (Traefik — k3s nodes only)
  ufw:
    rule: allow
    port: "443"
    proto: tcp
  when: inventory_hostname in (groups.get('k3s_server', []) + groups.get('k3s_agents', []))

- name: Allow k3s internal communication between cluster nodes
  ufw:
    rule: allow
    src: "{{ hostvars[item].ansible_host }}"
  loop: "{{ groups['k3s_server'] | default([]) + groups['k3s_agents'] | default([]) }}"
  when: inventory_hostname in (groups.get('k3s_server', []) + groups.get('k3s_agents', []))

- name: Allow routed (FORWARD) traffic for k3s overlay networking
  ufw:
    default: allow
    direction: routed
  when: inventory_hostname in (groups.get('k3s_server', []) + groups.get('k3s_agents', []))

# Mesh rules (ADR-0011) must survive the ufw reset above: the headscale
# role's own allows exist only in headscale.yml, so a routine site.yml
# converge would otherwise firewall out the mesh control plane.
- name: Allow headscale control plane on the headscale host (ADR-0011)
  ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "headscale control + TLS-ALPN + DERP (ADR-0011)"
  when: headscale_on_host | default(false)

- name: Allow headscale embedded DERP STUN on the headscale host (ADR-0011)
  ufw:
    rule: allow
    port: "3478"
    proto: udp
    comment: "headscale embedded DERP STUN (ADR-0011)"
  when: headscale_on_host | default(false)

- name: Allow tailscale wireguard on enrolled mesh nodes (ADR-0011)
  ufw:
    rule: allow
    port: "41641"
    proto: udp
    comment: "tailscale wireguard (ADR-0011)"
  when: inventory_hostname in (groups.get('tailscale_nodes', []))

- name: Enable ufw
  ufw:
    state: enabled
    policy: deny

- name: Configure fail2ban for SSH
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = {{ ssh_port }}
      maxretry = 5
      bantime = 3600
      findtime = 600
  notify: restart fail2ban

- name: Enable and start fail2ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started

- name: Enable unattended security upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
