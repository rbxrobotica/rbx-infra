# Managed by Ansible (rbx-infra: roles/paradedb). Do not edit on the host.
#
# Never let needrestart (invoked by unattended-upgrades / apt) auto-restart
# the production PostgreSQL cluster. On 2026-08-01 04:05 UTC a libssl upgrade
# bounced postgresql@16-main, resetting every live connection (robsond
# workers, in-flight pg_dump). See rbx-infra issue #164.
#
# Consequence: library security patches apply to PostgreSQL only at the next
# PLANNED restart. Schedule one whenever needrestart reports postgresql as
# deferred (needrestart -b | grep postgresql).
$nrconf{override_rc}{qr(^postgresql)} = 0;
