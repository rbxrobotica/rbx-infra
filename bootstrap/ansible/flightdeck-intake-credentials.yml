---
- name: Materialize only purpose-specific FlightDeck intake fields
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all/main.yml
    - roles/k8s-secrets/defaults/main.yml
  tasks:
    - name: Check the controlled hold and add or verify only two existing pass credentials
      ansible.builtin.command:
        argv: >-
          {{ [ansible_playbook_python,
              playbook_dir + '/../../scripts/flightdeck/intake_credentials.py',
              '--kubeconfig', kubeconfig_path,
              '--expected-cluster-uid', rbx_cluster_kube_system_uid]
             + ([] if ansible_check_mode else ['--apply']) }}
      register: flightdeck_intake_credentials
      changed_when: not ansible_check_mode
      check_mode: false
      no_log: true
