    k3s_agents:
      hosts:
        jaguar:
          ansible_host: 161.97.147.76
          k3s_node_labels:
            - "workload=analytics"
          k3s_node_taints:
            - "robson.io/dedicated=analytics:NoSchedule"
        # Rejoined 2026-08-06 after a clean OS reinstall. Previously an agent,
        # flagged compromised 2026-03-29 and removed 2026-04-07, then left
        # running outside this inventory for four months, which is why it never
        # received hardening.
        # Tainted as the Ubuntu 26.04 pilot (ADR-0010): a node whose rollback is
        # "reinstall it" must not hold whatever the scheduler happened to place
        # there, and local-path is the default storage class. Workloads opt in.
        bengal:
          ansible_host: 164.68.96.68
          k3s_node_labels:
            - "rbx.io/os-pilot=ubuntu-2604"
          k3s_node_taints:
            - "rbx.io/os-pilot=ubuntu-2604:NoSchedule"
    dns_servers:
      hosts:
        pantera:
          ansible_host: 149.102.139.33
          ansible_host_ipv6: "2a02:c207:2256:6730::1"
        eagle:
          ansible_host: 167.86.92.97
          ansible_host_ipv6: "2a02:c207:2252:7581::1"
    mail_servers:
      hosts:
        lince:
          ansible_host: 5.182.33.93
          ansible_host_ipv6: "2a02:c207:2327:3864::1"
    # Agent Execution Workbench (rbx-governance ADR-0500).
    # Registered for inventory completeness; intentionally excluded from
    # site.yml plays until the agent-runner baseline lands (agent-loop
    # roadmap Phase 3). Not a k3s node. Per ADR-0500 Amendment 2026-07
    # (rbx-security AGENT-KUBE-001), Corbetti now holds scoped WRITE kubeconfigs
    # to 8 app namespaces (corbetti-<agent> SAs); NO crown-jewel access
    # (rbx-ia-br/argocd/kube-system/monitoring/default), NO pass store on host.
    # Per-op human authz (policy §2) still required for every mutating kubectl.
    agent_workbench:
      hosts:
        corbetti:
          ansible_host: 13.140.148.30
    db_server:
      hosts:
        jaguar:
          ansible_host: 161.97.147.76
    # Mesh enrollment (ADR-0011). Deliberately EMPTY: hosts join the mesh
    # one PR at a time, lowest-risk first (bengal, corbetti, dns, k3s
    # servers, jaguar, lince). Adding a host here is the enrollment act;
    # headscale.yml refuses to enroll without an explicit auth key anyway.
    tailscale_nodes:
      hosts: {}
