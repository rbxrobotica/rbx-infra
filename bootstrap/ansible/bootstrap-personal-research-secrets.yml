---
# Run only after the inert app has created its namespace and the recovery gate
# has passed. Uses an existing operator kubeconfig; never replaces credentials.
- name: Materialize research runtime and registry secrets from pass
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    research_secret_specs:
      - name: personal-research-runtime
        namespace: rbx-ia-br
        type: Opaque
        stringData:
          CAREER_DATABASE_URL: "{{ lookup('ansible.builtin.pipe', 'pass show rbx/personal-research/runtime-database-url').splitlines()[0] }}"
          PG_CA_PEM: "{{ lookup('ansible.builtin.pipe', 'pass show rbx/personal-research/postgres-ca-pem') }}"
      - name: personal-research-registry
        namespace: rbx-ia-br
        type: kubernetes.io/dockerconfigjson
        stringData:
          .dockerconfigjson: "{{ lookup('ansible.builtin.pipe', 'pass show rbx/personal-research/registry-dockerconfig') }}"
      - name: migration
        namespace: personal-research
        type: Opaque
        stringData:
          CAREER_MIGRATION_DATABASE_URL: "{{ lookup('ansible.builtin.pipe', 'pass show rbx/personal-research/owner-database-url').splitlines()[0] }}"
  pre_tasks:
    - name: Require explicit operation and existing cluster identity
      ansible.builtin.assert:
        that:
          - personal_research_preflight_ref | default('') | length > 0
          - personal_research_secrets_authorized | default(false) | bool
          - personal_research_kubeconfig | default('') | length > 0
          - rbx_cluster_kube_system_uid | default('') | length > 0
    - name: Read cluster marker before accessing credentials
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ personal_research_kubeconfig }}", get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
      register: research_cluster
      changed_when: false
    - name: Refuse an unexpected cluster
      ansible.builtin.assert:
        that:
          - research_cluster.stdout | trim == rbx_cluster_kube_system_uid
  tasks:
    - name: Require verified TLS and dedicated database identities
      ansible.builtin.assert:
        that:
          - research_secret_specs[0].stringData.CAREER_DATABASE_URL | urlsplit('username') == 'career_watch_app'
          - research_secret_specs[2].stringData.CAREER_MIGRATION_DATABASE_URL | urlsplit('username') == 'career_watch_owner'
          - research_secret_specs[0].stringData.CAREER_DATABASE_URL | urlsplit('path') == '/career_watch'
          - research_secret_specs[2].stringData.CAREER_MIGRATION_DATABASE_URL | urlsplit('path') == '/career_watch'
          - research_secret_specs[0].stringData.CAREER_DATABASE_URL | urlsplit('query') is search('(^|&)sslmode=verify-full(&|$)')
          - research_secret_specs[2].stringData.CAREER_MIGRATION_DATABASE_URL | urlsplit('query') is search('(^|&)sslmode=verify-full(&|$)')
          - "'BEGIN CERTIFICATE' in research_secret_specs[0].stringData.PG_CA_PEM"
      no_log: true
    - name: Apply only the three dedicated secret records through stdin
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ personal_research_kubeconfig }}", apply, --server-side, --field-manager=personal-research-secrets, -f, '-']
        stdin: "{{ {'apiVersion': 'v1', 'kind': 'Secret', 'metadata': {'name': item.name, 'namespace': item.namespace}, 'type': item.type, 'stringData': item.stringData} | to_json }}"
      loop: "{{ research_secret_specs }}"
      no_log: true
