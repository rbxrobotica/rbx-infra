      - {eval_time: 30m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 59m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 61m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 2h, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}

  - name: another container's recent start does not stand in for this pod's statement count
    interval: 30s
    input_series:
      # robsond-a has run for 2 h with a count of 2; robsond-b, with no
      # robsond series, started recently. Only a per-pod join keeps them apart.
      - series: 'kube_pod_container_state_started{job="kube-state-metrics",namespace="robson",pod="robsond-a",container="robsond",uid="u-a"}'
        values: '-7200x120'
      - series: 'kube_pod_container_state_started{job="kube-state-metrics",namespace="robson",pod="robsond-b",container="robsond",uid="u-b"}'
        values: '0x120'
      - series: 'robsond_journal_operations_over_statement_bound{kubernetes_namespace="robson",kubernetes_pod_name="robsond-a"}'
        values: '2x120'
    alert_rule_test:
      - {eval_time: 1m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 10m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 30m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}

  - name: without kube-state-metrics a startup count is quiet (documented)
    interval: 30s
    input_series:
      - series: 'robsond_journal_operations_over_statement_bound{kubernetes_namespace="robson",kubernetes_pod_name="robsond-a"}'
        values: '_x10 2x100'
    alert_rule_test:
      - {eval_time: 10m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 30m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}

  # ── RBXRobsondTargetDown ────────────────────────────────────────────────
  - name: target down pages 3 minutes after up drops to 0
    interval: 30s
    input_series:
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-6c9d8f7b5-a1b2c"}'
        values: '1x20 0x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 13m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - eval_time: 14m
        alertname: RBXRobsondTargetDown
        exp_alerts:
          - exp_labels: {severity: critical, rbx_workstream: robson-trading}
            exp_annotations: &ann_TargetDown
              summary: "robsond is not being scraped"
              description: >-
                No healthy robsond scrape target for 3 minutes, longer than a deploy's gap: down, restarting, or
                scrape broken. The exchange stops are the only protection meanwhile.

  - name: target down pages when the pod is gone and nothing replaces it
    interval: 30s
    input_series:
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-6c9d8f7b5-a1b2c"}'
        values: '1x20 stale'
      - series: 'robsond_cycles_total{kubernetes_namespace="robson-testnet",kubernetes_pod_name="robsond-t",result="success"}'
        values: '0+1x40'
    alert_rule_test:
      - {eval_time: 13m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - eval_time: 14m
        alertname: RBXRobsondTargetDown
        exp_alerts:
          - exp_labels: {severity: critical, rbx_workstream: robson-trading}
            exp_annotations: *ann_TargetDown

  - name: a deploy gap as long as the longest measured (5 evaluations, 2 minutes) stays silent
    interval: 30s
    input_series:
      # Recreate: the old pod's listener closes at 10 m, the pod goes at
      # 10.5 m, and the new pod is scraped healthy from 12.5 m. A 2-minute
      # hold would page at 12 m.
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-6c9d8f7b5-a1b2c"}'
        values: '1x19 0 stale'
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-7f4b9c8d6-d3e4f"}'
        values: '_x25 1x40'
    alert_rule_test:
      - {eval_time: 11m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 12m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 13m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 16m, alertname: RBXRobsondTargetDown, exp_alerts: []}

  - name: other healthy targets do not hide a missing robsond
    interval: 30s
    input_series:
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-6c9d8f7b5-a1b2c"}'
        values: '1x4 stale'
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="redis-5d6f7c8b9-x1y2z"}'
        values: '1x40'
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson-testnet",kubernetes_pod_name="robsond-5b6c7d8e9-t1u2v"}'
        values: '1x40'
      - series: 'up{job="kube-state-metrics",kubernetes_namespace="robson",kubernetes_pod_name="robsond-6c9d8f7b5-a1b2c"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: RBXRobsondTargetDown
        exp_alerts:
          - exp_labels: {severity: critical, rbx_workstream: robson-trading}
            exp_annotations: *ann_TargetDown

  - name: a healthy robsond target never pages
    interval: 30s
    input_series:
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-6c9d8f7b5-a1b2c"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 1m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 5m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 15m, alertname: RBXRobsondTargetDown, exp_alerts: []}

  # ── RBXRobsondRestarting ────────────────────────────────────────────────
  - name: a crash loop for 2 minutes pages with the pod and the reason
    interval: 30s
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{job="kube-state-metrics",namespace="robson",pod="robsond-6c9d8f7b5-a1b2c",container="robsond",reason="CrashLoopBackOff"}'
        values: '1x20'
    alert_rule_test:
      - {eval_time: 1m30s, alertname: RBXRobsondRestarting, exp_alerts: []}
      - eval_time: 2m30s
        alertname: RBXRobsondRestarting
        exp_alerts:
          - exp_labels: {severity: critical, rbx_workstream: robson-trading, namespace: robson, pod: robsond-6c9d8f7b5-a1b2c, container: robsond, reason: CrashLoopBackOff}
            exp_annotations: &ann_Restarting_CrashLoopBackOff
              summary: "robsond is restarting (robsond-6c9d8f7b5-a1b2c: CrashLoopBackOff)"
              description: >-
                The robsond container has been waiting to start again for 2 minutes. A fast crash loop shows first
                as RBXRobsondTargetDown; this one names the pod and the reason.

  - name: a creating container, another namespace or container, or no series never pages
    interval: 30s
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{job="kube-state-metrics",namespace="robson",pod="robsond-6c9d8f7b5-a1b2c",container="robsond",reason="ContainerCreating"}'
        values: '1x20'
      - series: 'kube_pod_container_status_waiting_reason{job="kube-state-metrics",namespace="robson-testnet",pod="robsond-5b6c7d8e9-t1u2v",container="robsond",reason="CrashLoopBackOff"}'
        values: '1x20'
      - series: 'kube_pod_container_status_waiting_reason{job="kube-state-metrics",namespace="robson",pod="redis-5d6f7c8b9-x1y2z",container="redis",reason="CrashLoopBackOff"}'
        values: '1x20'
    alert_rule_test:
      - {eval_time: 1m, alertname: RBXRobsondRestarting, exp_alerts: []}
      - {eval_time: 3m, alertname: RBXRobsondRestarting, exp_alerts: []}
      - {eval_time: 5m, alertname: RBXRobsondRestarting, exp_alerts: []}
      - {eval_time: 9m, alertname: RBXRobsondRestarting, exp_alerts: []}

  # ── Part 2's fenced first start, end to end ─────────────────────────────
  - name: part 2's first deploy pages the fence at 5 minutes, nothing else, and clears on release
    interval: 30s
    input_series:
      # Pod p1 runs F part 1 (container started 2 h before the window): its
      # start reported marker_version. Its listener closes at 60 m and the
      # pod is gone at 60.5 m.
      - series: 'kube_pod_container_state_started{job="kube-state-metrics",namespace="robson",pod="robsond-1111111111-aaaaa",container="robsond",uid="u-1"}'
        values: '-7200x120 stale'
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-1111111111-aaaaa"}'
        values: '1x119 0 stale'
      - series: 'robsond_unclean_start{kubernetes_namespace="robson",kubernetes_pod_name="robsond-1111111111-aaaaa",reason="marker_version"}'
        values: '1x119 stale'
      - series: 'robsond_journal_latch{kubernetes_namespace="robson",kubernetes_pod_name="robsond-1111111111-aaaaa"}'
        values: '0x119 stale'
      - series: 'robsond_journal_operations_over_statement_bound{kubernetes_namespace="robson",kubernetes_pod_name="robsond-1111111111-aaaaa"}'
        values: '0x119 stale'
      - series: 'robsond_cycles_total{kubernetes_namespace="robson",kubernetes_pod_name="robsond-1111111111-aaaaa",result="success"}'
        values: '0+10x119 stale'
      # Pod p2 runs F part 2; its container starts at 61 m and is scraped
      # from 61.5 m. Its predecessor marked version 1, so the start is
      # unclean (marker_version) and fenced: unclean_start until the
      # operator releases at 70 m.
      - series: 'kube_pod_container_state_started{job="kube-state-metrics",namespace="robson",pod="robsond-2222222222-bbbbb",container="robsond",uid="u-2"}'
        values: '_x122 3660x120'
      - series: 'up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb"}'
        values: '_x123 1x120'
      - series: 'robsond_unclean_start{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",reason="marker_version"}'
        values: '_x123 1x120'
      - series: 'robsond_admission_fence_closed{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",reason="unclean_start"}'
        values: '_x123 1x16 0x103'
      - series: 'robsond_admission_fence_closed{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",reason="uncertain_outcome"}'
        values: '_x123 0x120'
      - series: 'robsond_admission_fence_closed{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",reason="unknown"}'
        values: '_x123 0x120'
      - series: 'robsond_recovery_incidents_open{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",reason="unclean_start"}'
        values: '_x123 1x16 0x103'
      - series: 'robsond_insurance_stop_stale_positions{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb"}'
        values: '_x123 0x120'
      - series: 'robsond_journal_latch{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb"}'
        values: '_x123 0x120'
      - series: 'robsond_journal_retry_set_depth{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb"}'
        values: '_x123 0x120'
      - series: 'robsond_journal_operations_over_statement_bound{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb"}'
        values: '_x123 0x120'
      - series: 'robsond_orphan_cancel_withheld_total{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb"}'
        values: '_x123 0x120'
      - series: 'robsond_streams_suspended{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",kind="system"}'
        values: '_x123 0x120'
      - series: 'robsond_streams_suspended{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",kind="position"}'
        values: '_x123 0x120'
      - series: 'robsond_cycles_total{kubernetes_namespace="robson",kubernetes_pod_name="robsond-2222222222-bbbbb",result="success"}'
        values: '_x123 0+10x120'
    alert_rule_test:
      - {eval_time: 62m, alertname: RBXRobsondAdmissionFenceClosed, exp_alerts: []}
      - {eval_time: 66m, alertname: RBXRobsondAdmissionFenceClosed, exp_alerts: []}
      - eval_time: 67m
        alertname: RBXRobsondAdmissionFenceClosed
        exp_alerts:
          - exp_labels: {severity: critical, rbx_workstream: robson-trading, reason: unclean_start}
            exp_annotations: *ann_AdmissionFenceClosed_unclean_start
      - {eval_time: 72m, alertname: RBXRobsondAdmissionFenceClosed, exp_alerts: []}
      - {eval_time: 61m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 62m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 63m, alertname: RBXRobsondTargetDown, exp_alerts: []}
      - {eval_time: 62m, alertname: RBXRobsondUncleanStart, exp_alerts: []}
      - {eval_time: 67m, alertname: RBXRobsondUncleanStart, exp_alerts: []}
      - {eval_time: 62m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 90m, alertname: RBXRobsondJournalStatementBound, exp_alerts: []}
      - {eval_time: 67m, alertname: RBXRobsondInsuranceStopGaugeAbsent, exp_alerts: []}
      - {eval_time: 90m, alertname: RBXRobsondInsuranceStopGaugeAbsent, exp_alerts: []}
      - {eval_time: 67m, alertname: RBXRobsondJournalLatchSet, exp_alerts: []}
      - {eval_time: 90m, alertname: RBXRobsondJournalRetrySetStuck, exp_alerts: []}
      - {eval_time: 90m, alertname: RBXRobsondOrphanStopsWithheld, exp_alerts: []}
