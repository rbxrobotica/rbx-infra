# Findings of `trivy config` (Trivy 0.76.2, built-in checks, severities
# CRITICAL and HIGH) that were already on main when
# scripts/scan-repository.sh started failing the build on them:
# 188 findings of 4 checks in 79 files, at commit f609e74 on 2026-11-28.
# They are listed so that the scan can fail on anything new. Listing a
# finding here is not a judgement that it is acceptable.
#
# An entry covers one check in the files it names. It stops applying at
# 00:00 UTC of its expired_at date, and from then on the scan fails on those
# findings again. Before that date, fix the manifests and remove their paths,
# or record a reviewed decision in the statement with a new date.
#
# A file that is not listed is not covered: a new manifest with one of these
# findings fails the scan. A new finding of the same check in a file that is
# already listed is covered until the entry expires, so a change to a listed
# file still needs a reader.
