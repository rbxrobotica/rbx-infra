# Workflow: Validate Manifests
# Runs on pull requests to validate Kubernetes manifests
name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint .

      - name: Setup kubeconform
        # Authenticated download: anonymous release downloads from shared
        # Actions runner IPs get rate limited (HTTP 429 with a tiny body,
        # which curl without -f happily saves and tar then rejects; this
        # broke PR #199 deterministically on 2026-08-12). gh uses the job
        # token. The sha256 is pinned from the release CHECKSUMS file, so
        # a wrong or tampered body fails closed before extraction.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.4 \
            --repo yannh/kubeconform \
            --pattern 'kubeconform-linux-amd64.tar.gz' \
            --output kubeconform.tar.gz
          echo "2b4ebeaa4d5ac4843cf8f7b7e66a8874252b6b71bc7cbfc4ef1cbf85acec7c07  kubeconform.tar.gz" | sha256sum -c -
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          # Exclude archived manifests (not deployed) and skip HTTPRoute (Gateway
          # API CRD with no standard json-schema - its schema URL 400s and trips
          # kubeconform's error exit instead of -ignore-missing-schemas).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t manifests < <(
              git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- apps core gitops platform |
                grep -E '\.(yml|yaml)$' |
                grep -v '/archived/' ||
                true
            )
          else
            mapfile -t manifests < <(
              find apps core gitops platform -type f \( -name "*.yml" -o -name "*.yaml" \) \
                -not -path "*/archived/*"
            )
          fi

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests to validate."
            exit 0
          fi

          skip_kinds=(
            AppProject
            Application
            Certificate
            ClusterIssuer
            ExternalSecret
            HTTPRoute
            IngressRoute
            Kustomization
            Middleware
            SecretStore
            WorkflowTemplate
          )
          skip_csv=$(IFS=,; echo "${skip_kinds[*]}")

          printf 'Validating %d manifest(s):\n' "${#manifests[@]}"
          printf '  - %s\n' "${manifests[@]}"
          kubeconform \
            -ignore-missing-schemas \
            -skip "${skip_csv}" \
            -summary \
            -output json \
            "${manifests[@]}"

      - name: Validate rendered production overlays
        run: |
          kubectl kustomize apps/prod/lda-prod >/dev/null
          kubectl kustomize apps/prod/rbx-catalog >/dev/null
          kubectl kustomize apps/prod/rbxsystems-ch >/dev/null
          kubectl kustomize apps/prod/strategos >/dev/null
          kubectl kustomize apps/prod/robson >/dev/null

      # robson runs money. Pattern R rule 2 keeps the sha out of the manifests,
      # which means the ONLY thing standing between prod and an unpinned image
      # is the overlay's images transformer. check-image-convention.sh cannot
      # see that: it lints files, not the render. This asserts the rendered
      # result, so a deleted, renamed or mistyped images entry fails the PR
      # instead of reaching the cluster.
      - name: Assert robson prod renders immutable image tags
        run: |
          render=$(kubectl kustomize apps/prod/robson)

          mapfile -t refs < <(printf '%s\n' "$render" \
            | grep -oE 'ghcr\.io/rbxrobotica/robson-v2:[^[:space:]"]+' || true)

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::apps/prod/robson renders no robson-v2 image reference"
            exit 1
          fi

          bad=0
          for ref in "${refs[@]}"; do
            if [[ "$ref" =~ :sha-[0-9a-f]+$ ]]; then
              echo "ok: $ref"
            else
              echo "::error::apps/prod/robson renders a non-immutable robson-v2 tag: $ref"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

  validate-argocd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup argocd
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Validate ArgoCD Applications
        run: |
          echo "Validating ArgoCD Application manifests..."
          find gitops -name "*.yml" -o -name "*.yaml" | while read file; do
            echo "Checking: $file"
            # Basic validation - argocd requires cluster connection for full validation
          done

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  convention-lint:
    # Pattern R enforcement on the app manifests a PR changes (blocks NEW
    # non-conformance; the pre-existing backlog is untouched).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Pattern R image convention (changed apps/ manifests)
        run: |
          mapfile -t FILES < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- apps/ | grep -E '\.(yml|yaml)$' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed app manifests — skipping."
            exit 0
          fi
          printf 'Checking %d changed manifest(s):\n' "${#FILES[@]}"
          printf '  - %s\n' "${FILES[@]}"
          bash scripts/check-image-convention.sh "${FILES[@]}"

      - name: P1 image-promotion debt report
        run: |
          bash scripts/report-p1-image-debt.sh

      - name: Agent runner delivery contract
        run: |
          bash bootstrap/ansible/roles/agent-workbench/tests/runner-delivery-contract.sh

      - name: Agent runner watchdog budget contract
        run: |
          bash bootstrap/ansible/roles/agent-workbench/tests/watchdog-budget-contract.sh
