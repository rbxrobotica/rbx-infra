# Workflow: Validate Manifests
# Runs on pull requests to validate Kubernetes manifests
name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup yamllint
        # yamllint, pathspec and PyYAML at exact versions, verified by hash
        # (scripts/validate-yaml-requirements.txt), in a virtual environment
        # that does not see the site-packages of the runner image. Its bin
        # directory goes first on PATH, so yamllint and every python3 of the
        # later steps of this job run with these three packages and no other.
        run: |
          python3 -m venv --without-pip "$RUNNER_TEMP/validate-yaml-env"
          python3 -m pip --python "$RUNNER_TEMP/validate-yaml-env/bin/python" install \
            --disable-pip-version-check --only-binary :all: --require-hashes \
            -r scripts/validate-yaml-requirements.txt
          "$RUNNER_TEMP/validate-yaml-env/bin/yamllint" --version
          echo "$RUNNER_TEMP/validate-yaml-env/bin" >> "$GITHUB_PATH"

      - name: Lint YAML files
        run: |
          yamllint .

      - name: Validate Comms webhook ingress isolation
        run: python3 scripts/validate-comms-webhook-ingress.py

      - name: Validate scoped production Robson Secret contract
        run: python3 scripts/validate-robson-prod-secret-scope.py

      - name: Test Headscale observations and candidate preparation with isolated fixtures
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_headscale_*.py' -v

      - name: Test bounded Headscale inventory with required YAML parser
        run: |
          python3 -B -c 'import yaml'
          python3 -B -m unittest discover -s scripts/tests -p 'test_resilience_headscale_inventory.py' -v

      - name: Test on-demand pass SSH-agent activation with mocked commands
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_pass_ssh_agent.py' -v

      - name: Test private mobile IRC preflight with isolated certificates
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_irc_*.py' -v

      - name: Test node capacity guard before resource reservations
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_reliability_capacity.py' -v

      - name: Validate unambiguous Helm values in ArgoCD Applications
        run: python3 scripts/validate-argocd-helm-values.py

      - name: Setup Helm for effective values and storage contracts
        # Helm v3.17.0 from get.helm.sh, the version this job already asked
        # for. The sha256 is the one Helm publishes beside the archive, so a
        # wrong or tampered body fails closed before extraction, and the last
        # line fails when another helm comes first on PATH.
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 \
            https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/helm.tar.gz"
          echo "fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          helm version --short | grep -E '^v3\.17\.0([^0-9]|$)'

      - name: Validate rendered reliability chart storage and identity
        run: python3 scripts/validate-reliability-charts.py

      - name: Setup kubeconform
        # Authenticated download: anonymous release downloads from shared
        # Actions runner IPs get rate limited (HTTP 429 with a tiny body,
        # which curl without -f happily saves and tar then rejects; this
        # broke PR #199 deterministically on 2026-08-12). gh uses the job
        # token. The sha256 is pinned from the release CHECKSUMS file, so
        # a wrong or tampered body fails closed before extraction.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.4 \
            --repo yannh/kubeconform \
            --pattern 'kubeconform-linux-amd64.tar.gz' \
            --output kubeconform.tar.gz
          echo "2b4ebeaa4d5ac4843cf8f7b7e66a8874252b6b71bc7cbfc4ef1cbf85acec7c07  kubeconform.tar.gz" | sha256sum -c -
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Setup kubectl
        # kubectl v1.37.3 from dl.k8s.io: the stable release on 2026-11-28,
        # which is what the unversioned setup action installed that day. The
        # sha256 is the one Kubernetes publishes beside the binary, and the
        # last line fails when another kubectl comes first on PATH.
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 \
            https://dl.k8s.io/release/v1.37.3/bin/linux/amd64/kubectl \
            --output "$RUNNER_TEMP/kubectl"
          echo "9a1b55af2795b25dd288dbef62387db9b5530087ab918d28c6ad067f2e3cb07c  $RUNNER_TEMP/kubectl" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          kubectl version --client | grep -Fx 'Client Version: v1.37.3'

      - name: Validate Kubernetes manifests
        run: |
          # Exclude archived manifests (not deployed) and skip HTTPRoute (Gateway
          # API CRD with no standard json-schema - its schema URL 400s and trips
          # kubeconform's error exit instead of -ignore-missing-schemas).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t manifests < <(
              git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- apps core gitops platform bootstrap/ansible/files/reliability |
                grep -E '\.(yml|yaml)$' |
                grep -v '/archived/' ||
                true
            )
          else
            mapfile -t manifests < <(
              find apps core gitops platform bootstrap/ansible/files/reliability -type f \( -name "*.yml" -o -name "*.yaml" \) \
                -not -path "*/archived/*"
            )
          fi

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests to validate."
            exit 0
          fi

          skip_kinds=(
            AppProject
            Application
            Certificate
            ClusterIssuer
            ExternalSecret
            HTTPRoute
            IngressRoute
            Kustomization
            Middleware
            SecretStore
            WorkflowTemplate
          )
          skip_csv=$(IFS=,; echo "${skip_kinds[*]}")

          printf 'Validating %d manifest(s):\n' "${#manifests[@]}"
          printf '  - %s\n' "${manifests[@]}"
          kubeconform \
            -ignore-missing-schemas \
            -skip "${skip_csv}" \
            -summary \
            -output json \
            "${manifests[@]}"

      - name: Validate rendered production overlays
        run: |
          kubectl kustomize apps/prod/lda-prod >/dev/null
          kubectl kustomize apps/prod/rbx-catalog >/dev/null
          kubectl kustomize apps/prod/rbxsystems-ch >/dev/null
          kubectl kustomize apps/prod/strategos >/dev/null
          kubectl kustomize apps/prod/kulinaryos-v1-proxy >/dev/null
          kubectl kustomize apps/prod/rbx-market-graph >/dev/null
          kubectl kustomize apps/prod/rbx-briefing-btc >/dev/null
          kubectl kustomize apps/prod/rbx-briefing-btc-sandbox >/dev/null
          kubectl kustomize apps/prod/robson >/dev/null

      - name: Validate inert sandbox buyer identity contract locally
        run: python3 scripts/validate-satwake-sandbox-identity.py

      # robson runs money. Pattern R rule 2 keeps the sha out of the manifests,
      # which means the ONLY thing standing between prod and an unpinned image
      # is the overlay's images transformer. check-image-convention.sh cannot
      # see that: it lints files, not the render. This asserts the rendered
      # result, so a deleted, renamed or mistyped images entry fails the PR
      # instead of reaching the cluster.
      - name: Assert robson prod renders immutable image tags
        run: |
          render=$(kubectl kustomize apps/prod/robson)

          mapfile -t refs < <(printf '%s\n' "$render" \
            | grep -oE 'ghcr\.io/rbxrobotica/robson-v2:[^[:space:]"]+' || true)

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::apps/prod/robson renders no robson-v2 image reference"
            exit 1
          fi

          bad=0
          for ref in "${refs[@]}"; do
            if [[ "$ref" =~ :sha-[0-9a-f]+$ ]]; then
              echo "ok: $ref"
            else
              echo "::error::apps/prod/robson renders a non-immutable robson-v2 tag: $ref"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

  prometheus-rules:
    # The alerting rules live in a Helm values string in
    # platform/monitoring/kube-prometheus-stack.yml, which yamllint and
    # kubeconform see as one scalar. This extracts them, runs promtool check
    # rules over every rule file and the alert unit tests in
    # scripts/tests/prometheus-rules, in podman from digest-pinned images, so
    # a broken expression fails the PR instead of reaching Prometheus. The
    # tooling itself gets bandit, osv-scanner and gitleaks (guardrails §2).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Check and unit-test Prometheus rules with promtool 3.0.1
        run: bash scripts/test-prometheus-rules.sh

      - name: Security-scan the Prometheus rule tooling
        run: bash scripts/scan-prometheus-rules-tooling.sh

  image-digest-pins:
    # Kustomize renders an images entry with a tag and a digest as
    # image:tag@digest and the cluster pulls by digest. A change that moves
    # newTag and keeps digest shows the new tag while the old image keeps
    # running. scripts/promote-image-tag.sh refuses to make that edit; a hand
    # edit and the self-push of the application repositories do not go through
    # it. This compares the kustomizations under apps/ of the two commits, in
    # podman from a digest-pinned image, with PyYAML pinned by hash.
    #
    # On a pull request the checkout is the merge commit GitHub makes for it,
    # and origin/<base>...HEAD compares the tip of the base branch in that
    # merge with the result of the merge: what merging would change on main,
    # before it does. On a push to main the job only reports: ArgoCD syncs main
    # by itself, so by the time it is red the entry may already be deployed.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          # The base commit has to be in the clone: the tip of the base branch
          # that the pull request was merged into for this run, or the commit
          # main pointed at before the push.
          fetch-depth: 0

      - name: Refuse a new tag beside an unchanged digest
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          else
            range="${BEFORE}..HEAD"
          fi
          bash scripts/check-digest-pin-promotion.sh "$range"

  image-promotion-tooling:
    # scripts/promote-image-tag.sh writes what a promotion pull request says
    # production will run. It must refuse an images entry that pins a digest:
    # a new tag beside the old digest keeps running the old image, and
    # scripts/check-digest-pin-promotion.sh must fail a change that leaves one
    # there (job image-digest-pins). The tests run in podman from a
    # digest-pinned image, in the environment both scripts require (PyYAML
    # pinned by hash), and the scripts, the verifier and the tests get
    # shellcheck, bandit, osv-scanner and gitleaks (guardrails §2).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Test the image promotion script and the digest pin check in their pinned environment
        run: bash scripts/test-promote-image-tag.sh

      - name: Security-scan the image promotion tooling
        run: bash scripts/scan-promote-image-tag-tooling.sh

  image-promotion-on-runner:
    # image-update.yml runs the promotion script on ubuntu-latest, with the
    # bash, awk and python3 that image ships and the PyYAML that
    # scripts/promote-image-tag-env.sh installs by hash. The same command
    # provisions the same environment here and the same tests run in it, so a
    # runner image that cannot provision it, or whose python3 reads a
    # kustomization differently, fails a pull request before it fails a
    # promotion.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Provision the pinned YAML parser as image-update.yml does
        run: bash scripts/promote-image-tag-env.sh "$RUNNER_TEMP/promote-image-tag-env"

      - name: Test the image promotion script in that environment
        run: |
          "$RUNNER_TEMP/promote-image-tag-env/bin/python" -I -B -m unittest discover \
            -s scripts/tests -p 'test_promote_image_tag.py' -v

  validate-argocd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup argocd
        # Argo CD CLI v3.6.3, the latest release on 2026-11-28, which is what
        # the unversioned download resolved to that day. Authenticated
        # download for the reason given at "Setup kubeconform" above. The
        # sha256 is the one in cli_checksums.txt of the release, so a wrong or
        # tampered body fails closed before the binary is installed or run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.6.3 \
            --repo argoproj/argo-cd \
            --pattern 'argocd-linux-amd64' \
            --output "$RUNNER_TEMP/argocd"
          echo "3750cd7ed2a2ef05c640344b86f29aa99c9783e847c8f326c81e3900ad39412b  $RUNNER_TEMP/argocd" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/argocd" /usr/local/bin/argocd
          argocd version --client --short | grep -E '(^|[^0-9.])v3\.6\.3([^0-9]|$)'

      - name: Validate ArgoCD Applications
        run: |
          echo "Validating ArgoCD Application manifests..."
          find gitops -name "*.yml" -o -name "*.yaml" | while read file; do
            echo "Checking: $file"
            # Basic validation - argocd requires cluster connection for full validation
          done

  security-scan:
    # The checks of guardrails §2 over the whole repository, where the jobs
    # above cover the tooling they test: Trivy over every configuration file
    # (CRITICAL and HIGH), gitleaks over every file, osv-scanner over every
    # lockfile. In podman from digest-pinned images, by the script that runs
    # the same way on a workstation. A finding fails the job unless a
    # reviewed list names that finding: scripts/scan-repository-baseline.toml
    # lists single Trivy and osv-scanner findings, each until a date, and
    # .gitleaks.toml lists matches that were read and are not secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Scan configuration, secrets and dependencies of the whole repository
        run: bash scripts/scan-repository.sh

  sandbox-email-key-source-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Test sandbox email key staging without a cluster or pass store
        run: python3 -m unittest discover -s scripts/tests -p 'test_stage_satwake_sandbox_email_keys.py' -v

      - name: Test sandbox core source staging without a cluster or pass store
        run: python3 -m unittest discover -s scripts/tests -p 'test_stage_satwake_sandbox_core_secrets.py' -v

  convention-lint:
    # Pattern R enforcement on the app manifests a PR changes (blocks NEW
    # non-conformance; the pre-existing backlog is untouched).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Pattern R image convention (changed apps/ manifests)
        run: |
          mapfile -t FILES < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- apps/ | grep -E '\.(yml|yaml)$' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed app manifests — skipping."
            exit 0
          fi
          printf 'Checking %d changed manifest(s):\n' "${#FILES[@]}"
          printf '  - %s\n' "${FILES[@]}"
          bash scripts/check-image-convention.sh "${FILES[@]}"

      - name: P1 image-promotion debt report
        run: |
          bash scripts/report-p1-image-debt.sh

      - name: Agent runner delivery contract
        run: |
          bash bootstrap/ansible/roles/agent-workbench/tests/runner-delivery-contract.sh
          bash bootstrap/ansible/roles/agent-workbench/tests/runner-provider-neutral-contract.sh
          bash bootstrap/ansible/roles/agent-workbench/tests/runner-e2e-contract.sh
          bash bootstrap/ansible/roles/agent-workbench/tests/runner-capability-probe-contract.sh

      - name: Agent runner watchdog budget contract
        run: |
          bash bootstrap/ansible/roles/agent-workbench/tests/watchdog-budget-contract.sh
