name: IRC agent pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/irc/**'
      - '.github/workflows/irc-pilot-test.yml'
  push:
    branches: [main]
    paths:
      - 'infra/irc/**'
      - '.github/workflows/irc-pilot-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install IRC test and MCP dependencies
        working-directory: infra/irc/bots/strategos-irc-bot
        run: python -m pip install '.[test,agents]'
      - name: Test read-only bot and agent transport with local sockets and MCP
        working-directory: infra/irc/bots/strategos-irc-bot
        run: python -m pytest
      - name: Check installer syntax
        run: bash -n infra/irc/scripts/install-agent-irc.sh
