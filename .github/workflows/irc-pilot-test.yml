name: IRC agent pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/irc/**'
      - '.github/workflows/irc-pilot-test.yml'
  push:
    branches: [main]
    paths:
      - 'infra/irc/**'
      - '.github/workflows/irc-pilot-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostgreSQL 16.15-bookworm; disposable test state, no production data.
        image: postgres:16.15-bookworm@sha256:efdf07c2f9d4df592783dcc8ea5f6db02efbf5f6452b527225ff5e58364570e9
        env:
          POSTGRES_USER: irc_test
          POSTGRES_PASSWORD: irc_test_only
          POSTGRES_DB: irc_mailbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irc_test -d irc_mailbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install IRC, MCP and PostgreSQL test dependencies
        working-directory: infra/irc/bots/strategos-irc-bot
        run: python -m pip install '.[test,agents,postgres]'
      - name: Test bot, transport, MCP and PostgreSQL with synthetic state
        working-directory: infra/irc/bots/strategos-irc-bot
        env:
          RBX_IRC_TEST_POSTGRES_URL: postgresql://irc_test:irc_test_only@127.0.0.1:5432/irc_mailbox_test
          RBX_IRC_REQUIRE_POSTGRES: '1'
        run: python -m pytest
      - name: Check installer syntax
        run: bash -n infra/irc/scripts/install-agent-irc.sh
      - name: Test isolated consultation pilots without providers or model downloads
        run: python -m unittest discover -s infra/irc/pilots -p 'test_*.py' -v
