name: Object inventory read boundaries
on:
  push:
    paths: ['experiments/object-inventory/**', '.github/workflows/object-inventory.yml']
  pull_request:
    paths: ['experiments/object-inventory/**', '.github/workflows/object-inventory.yml']
permissions:
  contents: read
jobs:
  offline-read-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - run: node --test experiments/object-inventory/test_inventory.mjs
