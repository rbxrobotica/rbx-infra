# ArgoCD Application: ArgoCD
# GitOps controller - must be installed first
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: rbx-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.3.0
    helm:
      values: |
        global:
          domain: argocd.rbx.ia.br
        configs:
          cm:
            # Pinned explicitly, not left on the chart default.
            #
            # ArgoCD 3.0 flips the default resource tracking method from
            # `label` to `annotation`. That is a live-cluster migration: every
            # managed resource has to be re-identified under the new scheme.
            # Combined with `prune: true`, which most Applications here set,
            # a resource ArgoCD fails to re-adopt looks like an orphan.
            #
            # This cluster currently runs on the `label` default (argocd-cm has
            # no `application.resourceTrackingMethod` key, and
            # `application.instanceLabelKey` is
            # `argocd.argoproj.io/instance`). Writing the current behaviour
            # down makes the 2.11 -> 3.x upgrade a version change only, with
            # tracking migration as a separate, observed step afterwards.
            application.resourceTrackingMethod: label
          params:
            server.insecure: true
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - argocd.rbx.ia.br
            tls:
              - secretName: argocd-tls
                hosts:
                  - argocd.rbx.ia.br
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        repoServer:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        applicationSet:
          enabled: true
        notifications:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: argocd-applicationset-controller
      jsonPointers:
        - /spec/selector
    - group: apps
      kind: Deployment
      name: argocd-dex-server
      jsonPointers:
        - /spec/selector
    - group: apps
      kind: Deployment
      name: argocd-repo-server
      jsonPointers:
        - /spec/selector
    - group: apps
      kind: Deployment
      name: argocd-server
      jsonPointers:
        - /spec/selector
    - group: apps
      kind: StatefulSet
      name: argocd-application-controller
      jsonPointers:
        - /spec/selector
