# ArgoCD Application: kube-prometheus-stack
# Deploys: Prometheus + Grafana + AlertManager + node-exporter + kube-state-metrics
#
# Sync wave -5: installs CRDs (PrometheusRule, ServiceMonitor, etc.)
# that other components may depend on.
#
# Grafana admin credentials: monitoring/grafana-admin secret (created by k8s-secrets Ansible role).
# DNS: grafana.rbxsystems.ch → var.k3s_ingress_ip (managed in infra/terraform/dns/rbxsystems_ch.tf).
#
# ADR-11: self-hosted, budget-conscious. Retention: 7d metrics.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: rbx-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: rbx-platform

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.4.0
    helm:
      values: |
        # ── Grafana ──────────────────────────────────────────────────────────
        grafana:
          admin:
            existingSecret: "grafana-admin"
            userKey: "admin-user"
            passwordKey: "admin-password"

          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - grafana.rbxsystems.ch
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.rbxsystems.ch

          persistence:
            enabled: true
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            size: 5Gi

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          # Pre-configure Loki datasource
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
              jsonData:
                maxLines: 1000

        # ── Prometheus ───────────────────────────────────────────────────────
        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: "6GB"

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1536Mi

            # Scrape pods with prometheus.io/scrape: "true" annotations
            # This picks up robsond and other annotated pods automatically.
            additionalScrapeConfigs:
              - job_name: kubernetes-pods-annotations
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: "true"
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    regex: ([^:]+)(?::\d+)?;(\d+)
                    replacement: $1:$2
                    target_label: __address__
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: kubernetes_namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    action: replace
                    target_label: kubernetes_pod_name

        # ── k3s component scraping ───────────────────────────────────────────
        # k3s runs kube-proxy, the scheduler and the controller-manager inside
        # the k3s binary, not as pods, so the chart's component scrapes can
        # never find them and their *Down alerts fire forever as false
        # positives. Standard k3s guidance: disable those component monitors.
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false

        # ── AlertManager ─────────────────────────────────────────────────────
        # Email notifications: alerts@rbxsystems.ch (dedicated Mailcow mailbox)
        # -> mail.rbxsystems.ch:587 -> existing Postmark relay -> ceo@rbxsystems.ch.
        # SMTP password lives in monitoring/alertmanager-smtp (key: password),
        # created by the k8s-secrets Ansible role from pass
        # rbx/mail/alerts-password. Never inline the password here.
        alertmanager:
          config:
            global:
              smtp_from: "alerts@rbxsystems.ch"
              smtp_smarthost: "mail.rbxsystems.ch:587"
              smtp_auth_username: "alerts@rbxsystems.ch"
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              smtp_require_tls: true
            route:
              receiver: email-ops
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Watchdog is an always-firing liveness alert; never email it.
                - matchers:
                    - alertname = "Watchdog"
                  receiver: "null"
                # info/none severity (CPUThrottlingHigh, InfoInhibitor, ...) is
                # dashboard material, not operator-interrupt material. Keep it
                # out of email so warning/critical mails stay trustworthy.
                - matchers:
                    - severity =~ "info|none"
                  receiver: "null"
                - matchers:
                    - severity = "critical"
                  receiver: email-ops
                  repeat_interval: 4h
            receivers:
              - name: "null"
              - name: email-ops
                email_configs:
                  - to: "ceo@rbxsystems.ch"
                    send_resolved: true
          alertmanagerSpec:
            replicas: 1
            # Mounts monitoring/alertmanager-smtp at
            # /etc/alertmanager/secrets/alertmanager-smtp/ (password file above).
            secrets:
              - alertmanager-smtp
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi

        # ── node-exporter ────────────────────────────────────────────────────
        nodeExporter:
          enabled: true

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # ── kube-state-metrics ───────────────────────────────────────────────
        kubeStateMetrics:
          enabled: true

        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        additionalPrometheusRulesMap:
          rbx-p1b-core:
            groups:
              - name: rbx.p1b.core
                rules:
                  - alert: RBXMetricsServerEndpointMissing
                    expr: absent(kube_endpoint_address{namespace="kube-system", endpoint="metrics-server", ready="true"})
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: p1b-observability
                    annotations:
                      summary: "metrics-server has no ready endpoint"
                      description: "metrics-server has no ready endpoint; kubectl top and HPA signals may be unavailable."

                  - alert: RBXPodCrashLoopOrImagePull
                    expr: kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull"} == 1
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: p1b-observability
                    annotations:
                      summary: "Pod container is waiting in CrashLoopBackOff or image pull failure"
                      description: "A pod container has remained in CrashLoopBackOff, ImagePullBackOff, or ErrImagePull for more than 10 minutes."

                  - alert: RBXCriticalEndpointNotReady
                    expr: |
                      (
                        kube_endpoint_info{namespace=~"langfuse|rbx-ledger|truthmetal"}
                        unless on(namespace, endpoint)
                        kube_endpoint_address{ready="true"}
                      )
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: p1b-observability
                    annotations:
                      summary: "Critical service endpoint has no ready backend"
                      description: "A critical RBX endpoint has had no ready backend address for more than 10 minutes."

          rbx-robson-trading:
            groups:
              - name: rbx.robson.trading
                rules:
                  - alert: RBXRobsondMetricsAbsent
                    expr: absent(robsond_cycles_total{kubernetes_namespace="robson"})
                    for: 10m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond metrics missing from Prometheus"
                      description: "No robsond_cycles_total series from namespace robson for 10 minutes. The daemon is down or scraping is broken while real capital may be exposed."

                  - alert: RBXRobsondMonthlyHaltActive
                    expr: robsond_monthly_halt_active{kubernetes_namespace="robson"} == 1
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson MonthlyHalt circuit breaker is active"
                      description: "The 4% monthly drawdown circuit breaker has engaged. Trading is halted until the month boundary; operator review required."

                  - alert: RBXRobsondStaleActivePositions
                    expr: robsond_stale_active_positions{kubernetes_namespace="robson"} > 0
                    for: 10m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson has open book positions missing on the exchange"
                      description: "robsond_stale_active_positions above zero for 10 minutes. A sustained value means reconciliation is not clearing a stuck position (2026-07-31 incident)."

                  - alert: RBXRobsondCycleErrors
                    expr: sum(rate(robsond_cycles_total{kubernetes_namespace="robson", result="error"}[5m])) > 0
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond engine cycles are failing"
                      description: "Engine cycles have been ending in error for 10 minutes. Check robsond logs in namespace robson."

                  - alert: RBXRobsondCyclesStalled
                    expr: sum(rate(robsond_cycles_total{kubernetes_namespace="robson"}[10m])) == 0
                    for: 15m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond is up but processing no cycles"
                      description: "Scrape works but no engine cycles completed in 15 minutes. The daemon may be wedged (e.g. silent market data websocket, robson issue #138)."

                  - alert: RBXRobsondMarketDataSilentWithOpenPosition
                    expr: |
                      max(robsond_market_data_silent_seconds{kubernetes_namespace="robson"}) > 300
                      and on()
                      max(robsond_active_positions{kubernetes_namespace="robson"}) > 0
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Market data silent while a position is open"
                      description: "No WS tick for 5+ minutes on a symbol while positions are open (ADR-0044). The trailing stop may be blind when it matters; check WS endpoints and fallback."

                  - alert: RBXRobsondMarketDataSilent
                    expr: max(robsond_market_data_silent_seconds{kubernetes_namespace="robson"}) > 600
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Market data silent (no open position)"
                      description: "No WebSocket tick for over 10 minutes on at least one symbol. No position is open, so this is not capital-exposed, but the feed should not be silent."

                  - alert: RBXRobsondMarketDataRestFallbackSustained
                    expr: max(robsond_market_data_mode{kubernetes_namespace="robson"}) == 1
                    for: 30m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Market data stuck on REST fallback"
                      description: "A symbol has been on REST fallback (mode == 1) for 30 minutes (ADR-0044). Fallback is degraded mode, not a steady state; check WebSocket endpoint health."

              # Container-runtime alerts for robsond, as opposed to the
              # trading-logic alerts in rbx.robson.trading above.
              #
              # LABEL WARNING: these rules select on `namespace`, NOT
              # `kubernetes_namespace`. The rules above scrape robsond's own
              # /metrics through the annotation-based job, which relabels to
              # `kubernetes_namespace`. These read kube-state-metrics and
              # cAdvisor instead, which carry the standard `namespace` label.
              # Using the wrong one yields a rule that never fires, which is
              # worse than no rule. Every expression here was verified against
              # the live Prometheus before being committed.
              #
              # Why this group exists: on 2026-08-18 07:24 UTC robsond was
              # OOMKilled with an open BTCUSDT position and recovered in 5s.
              # Nothing alerted. RBXRobsondMetricsAbsent needs 10 minutes of
              # missing series, so a fast restart is invisible to it. The kill
              # was found by hand, three days later, only because the operator
              # asked about something else.
              - name: rbx.robson.runtime
                rules:
                  # The window comes from the termination timestamp, NOT from
                  # increase() over the restart counter. increase() only sees a
                  # rise Prometheus actually observed: a container OOMKilled
                  # before its first scrape is already at 1 when first seen, so
                  # the counter never appears to move and the alert stays silent
                  # through the exact event it exists for.
                  - alert: RBXRobsondOOMKilled
                    expr: |
                      max by (namespace, pod, container) (
                        kube_pod_container_status_last_terminated_reason{namespace="robson",container="robsond",reason="OOMKilled"}
                      ) == 1
                      and on (namespace, pod, container) (
                        time() - max by (namespace, pod, container) (
                          kube_pod_container_status_last_terminated_timestamp{namespace="robson",container="robsond"}
                        )
                      ) < 7200
                    for: 0m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond was OOMKilled"
                      description: >-
                        The robsond container hit its memory limit and was
                        killed within the last 2 hours. Trading was unattended
                        for the duration of the restart; the exchange insurance
                        stop is the only protection during that window
                        (ADR-0039). Check the memory trend before assuming it
                        was a one-off.

                  - alert: RBXRobsondMemoryCritical
                    expr: |
                      max by (namespace, pod, container) (
                        container_memory_working_set_bytes{namespace="robson",container="robsond"}
                      )
                      / on (namespace, pod, container) group_left
                      max by (namespace, pod, container) (
                        kube_pod_container_resource_limits{namespace="robson",container="robsond",resource="memory"}
                      ) > 0.90
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond memory above 90% of its limit"
                      description: >-
                        robsond working set has been above 90% of its memory
                        limit for 5 minutes. An OOMKill is imminent. If a
                        position is open, prefer acting now over being
                        restarted mid-trade.

                  - alert: RBXRobsondMemoryApproachingLimit
                    expr: |
                      max by (namespace, pod, container) (
                        container_memory_working_set_bytes{namespace="robson",container="robsond"}
                      )
                      / on (namespace, pod, container) group_left
                      max by (namespace, pod, container) (
                        kube_pod_container_resource_limits{namespace="robson",container="robsond",resource="memory"}
                      ) > 0.75
                    for: 15m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond memory above 75% of its limit"
                      description: >-
                        robsond working set has been above 75% of its memory
                        limit for 15 minutes. The growth cause is not
                        identified as of 2026-08-18; at the rate measured then
                        (roughly 13 to 15 MiB/h under active market data) this
                        leaves hours, not days, before the limit.

                  - alert: RBXRobsondContainerRestarted
                    expr: |
                      max by (namespace, pod, container) (
                        increase(kube_pod_container_status_restarts_total{namespace="robson",container="robsond"}[15m])
                      ) > 0
                    for: 0m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond container restarted"
                      description: >-
                        The robsond container restarted IN PLACE in the last 15
                        minutes: OOMKill, liveness kill or crash. It does NOT
                        catch a rollout, because a new pod starts its restart
                        counter at zero, and that is deliberate: a deploy the
                        operator asked for should not page. Prolonged absence
                        from any cause is covered by RBXRobsondMetricsAbsent.

        # Temporarily disable PrometheusRule admission webhooks until the
        # webhook serving certificate/CA bundle is regenerated in an approved
        # maintenance window. The broken CA currently blocks ArgoCD from
        # reconciling PrometheusRule resources.
        prometheusOperator:
          admissionWebhooks:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.selector
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.selector
