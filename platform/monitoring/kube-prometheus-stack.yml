# ArgoCD Application: kube-prometheus-stack
# Deploys: Prometheus + Grafana + AlertManager + node-exporter + kube-state-metrics
#
# Sync wave -5: installs CRDs (PrometheusRule, ServiceMonitor, etc.)
# that other components may depend on.
#
# Grafana admin credentials: monitoring/grafana-admin secret (created by k8s-secrets Ansible role).
# DNS: grafana.rbxsystems.ch → var.k3s_ingress_ip (managed in infra/terraform/dns/rbxsystems_ch.tf).
#
# ADR-11: self-hosted, budget-conscious. Retention: 7d metrics.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: rbx-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: rbx-platform

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.4.0
    helm:
      values: |
        # ── Grafana ──────────────────────────────────────────────────────────
        grafana:
          admin:
            existingSecret: "grafana-admin"
            userKey: "admin-user"
            passwordKey: "admin-password"

          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - grafana.rbxsystems.ch
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.rbxsystems.ch

          persistence:
            enabled: true
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            size: 5Gi

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi

          # Pre-configure Loki datasource
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
              jsonData:
                maxLines: 1000

        # ── Prometheus ───────────────────────────────────────────────────────
          deploymentStrategy:
            type: Recreate
          tolerations:
            - key: rbx.io/maintenance
              operator: Equal
              value: stabilization
              effect: NoSchedule
          sidecar:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          readinessProbe:
            timeoutSeconds: 5
        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: "6GB"

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

            resources:
              requests:
                cpu: 250m
                memory: 1536Mi
              limits:
                cpu: '1'
                memory: 2Gi

            # Scrape pods with prometheus.io/scrape: "true" annotations
            # This picks up robsond and other annotated pods automatically.
            additionalScrapeConfigs:
              - job_name: kubernetes-pods-annotations
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: "true"
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    regex: ([^:]+)(?::\d+)?;(\d+)
                    replacement: $1:$2
                    target_label: __address__
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: kubernetes_namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    action: replace
                    target_label: kubernetes_pod_name

        # ── k3s component scraping ───────────────────────────────────────────
        # k3s runs kube-proxy, the scheduler and the controller-manager inside
        # the k3s binary, not as pods, so the chart's component scrapes can
        # never find them and their *Down alerts fire forever as false
        # positives. Standard k3s guidance: disable those component monitors.
            tolerations:
              - key: rbx.io/maintenance
                operator: Equal
                value: stabilization
                effect: NoSchedule
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false

        # ── AlertManager ─────────────────────────────────────────────────────
        # Email notifications: alerts@rbxsystems.ch (dedicated Mailcow mailbox)
        # -> mail.rbxsystems.ch:587 -> existing Postmark relay -> ceo@rbxsystems.ch.
        # SMTP password lives in monitoring/alertmanager-smtp (key: password),
        # created by the k8s-secrets Ansible role from pass
        # rbx/mail/alerts-password. Never inline the password here.
        alertmanager:
          config:
            global:
              smtp_from: "alerts@rbxsystems.ch"
              smtp_smarthost: "mail.rbxsystems.ch:587"
              smtp_auth_username: "alerts@rbxsystems.ch"
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              smtp_require_tls: true
            route:
              receiver: email-ops
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Watchdog is an always-firing liveness alert; never email it.
                - matchers:
                    - alertname = "Watchdog"
                  receiver: "null"
                # info/none severity (CPUThrottlingHigh, InfoInhibitor, ...) is
                # dashboard material, not operator-interrupt material. Keep it
                # out of email so warning/critical mails stay trustworthy.
                - matchers:
                    - severity =~ "info|none"
                  receiver: "null"
                - matchers:
                    - severity = "critical"
                  receiver: email-ops
                  repeat_interval: 4h
            receivers:
              - name: "null"
              - name: email-ops
                email_configs:
                  - to: "ceo@rbxsystems.ch"
                    send_resolved: true
          alertmanagerSpec:
            replicas: 1
            # Mounts monitoring/alertmanager-smtp at
            # /etc/alertmanager/secrets/alertmanager-smtp/ (password file above).
            secrets:
              - alertmanager-smtp
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

        # ── node-exporter ────────────────────────────────────────────────────
            tolerations:
              - key: rbx.io/maintenance
                operator: Equal
                value: stabilization
                effect: NoSchedule
        nodeExporter:
          enabled: true

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # ── kube-state-metrics ───────────────────────────────────────────────
        kubeStateMetrics:
          enabled: true

        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        additionalPrometheusRulesMap:
          rbx-p1b-core:
            groups:
              - name: rbx.p1b.core
                rules:
                  - alert: RBXMetricsServerEndpointMissing
                    expr: absent(kube_endpoint_address{namespace="kube-system", endpoint="metrics-server", ready="true"})
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: p1b-observability
                    annotations:
                      summary: "metrics-server has no ready endpoint"
                      description: "metrics-server has no ready endpoint; kubectl top and HPA signals may be unavailable."

                  - alert: RBXPodCrashLoopOrImagePull
                    expr: kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull"} == 1
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: p1b-observability
                    annotations:
                      summary: "Pod container is waiting in CrashLoopBackOff or image pull failure"
                      description: "A pod container has remained in CrashLoopBackOff, ImagePullBackOff, or ErrImagePull for more than 10 minutes."

                  - alert: RBXCriticalEndpointNotReady
                    expr: |
                      (
                        kube_endpoint_info{namespace=~"langfuse|rbx-ledger|truthmetal"}
                        unless on(namespace, endpoint)
                        kube_endpoint_address{ready="true"}
                      )
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: p1b-observability
                    annotations:
                      summary: "Critical service endpoint has no ready backend"
                      description: "A critical RBX endpoint has had no ready backend address for more than 10 minutes."

          rbx-robson-trading:
            groups:
              - name: rbx.robson.trading
                rules:
                  - alert: RBXRobsondMetricsAbsent
                    expr: absent(robsond_cycles_total{kubernetes_namespace="robson"})
                    for: 10m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond metrics missing from Prometheus"
                      description: "No robsond_cycles_total series from namespace robson for 10 minutes. The daemon is down or scraping is broken while real capital may be exposed."

                  - alert: RBXRobsondMonthlyHaltActive
                    expr: robsond_monthly_halt_active{kubernetes_namespace="robson"} == 1
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson MonthlyHalt circuit breaker is active"
                      description: "The 4% monthly drawdown circuit breaker has engaged. Trading is halted until the month boundary; operator review required."

                  - alert: RBXRobsondMonthlyBudgetBasisInvalid
                    expr: robsond_monthly_budget_basis_invalid{kubernetes_namespace="robson"} == 1
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson monthly budget basis is invalid"
                      description: >-
                        monthly_state.capital_base is not positive for the current month. New entries are denied and
                        MonthlyHalt does not fire on it (robson ADR-0051 §1), so positions stay open on their stops.
                        Correct the basis with evidence, or the next month boundary writes a new one; entries resume
                        without a restart.

                  - alert: RBXRobsondMonthlyBudgetBasisUnread
                    expr: time() - robsond_monthly_budget_basis_last_read_timestamp_seconds{kubernetes_namespace="robson"} > 300
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson cannot read its monthly budget basis"
                      description: >-
                        robsond has had no successful read of monthly_state for its budget basis alarm for over 10
                        minutes, or none since it started. The invalid-basis gauge keeps the last value it read, so
                        whether the basis is valid right now is unknown.

                  - alert: RBXRobsondStaleActivePositions
                    expr: robsond_stale_active_positions{kubernetes_namespace="robson"} > 0
                    for: 10m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson has open book positions missing on the exchange"
                      description: "robsond_stale_active_positions above zero for 10 minutes. A sustained value means reconciliation is not clearing a stuck position (2026-07-31 incident)."

                  - alert: RBXRobsondCycleErrors
                    expr: sum(rate(robsond_cycles_total{kubernetes_namespace="robson", result="error"}[5m])) > 0
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond engine cycles are failing"
                      description: "Engine cycles have been ending in error for 10 minutes. Check robsond logs in namespace robson."

                  - alert: RBXRobsondCyclesStalled
                    expr: sum(rate(robsond_cycles_total{kubernetes_namespace="robson"}[10m])) == 0
                    for: 15m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond is up but processing no cycles"
                      description: "Scrape works but no engine cycles completed in 15 minutes. The daemon may be wedged (e.g. silent market data websocket, robson issue #138)."

                  - alert: RBXRobsondMarketDataSilentWithOpenPosition
                    expr: |
                      max(robsond_market_data_silent_seconds{kubernetes_namespace="robson"}) > 300
                      and on()
                      max(robsond_active_positions{kubernetes_namespace="robson"}) > 0
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Market data silent while a position is open"
                      description: "No WS tick for 5+ minutes on a symbol while positions are open (ADR-0044). The trailing stop may be blind when it matters; check WS endpoints and fallback."

                  - alert: RBXRobsondMarketDataSilent
                    expr: max(robsond_market_data_silent_seconds{kubernetes_namespace="robson"}) > 600
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Market data silent (no open position)"
                      description: "No WebSocket tick for over 10 minutes on at least one symbol. No position is open, so this is not capital-exposed, but the feed should not be silent."

                  - alert: RBXRobsondMarketDataRestFallbackSustained
                    expr: max(robsond_market_data_mode{kubernetes_namespace="robson"}) == 1
                    for: 30m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Market data stuck on REST fallback"
                      description: "A symbol has been on REST fallback (mode == 1) for 30 minutes (ADR-0044). Fallback is degraded mode, not a steady state; check WebSocket endpoint health."

              # Container-runtime alerts for robsond, as opposed to the
              # trading-logic alerts in rbx.robson.trading above.
              #
              # LABEL WARNING: these rules select on `namespace`, NOT
              # `kubernetes_namespace`. The rules above scrape robsond's own
              # /metrics through the annotation-based job, which relabels to
              # `kubernetes_namespace`. These read kube-state-metrics and
              # cAdvisor instead, which carry the standard `namespace` label.
              # Using the wrong one yields a rule that never fires, which is
              # worse than no rule. Every expression here was verified against
              # the live Prometheus before being committed.
              #
              # Why this group exists: on 2026-08-18 07:24 UTC robsond was
              # OOMKilled with an open BTCUSDT position and recovered in 5s.
              # Nothing alerted. RBXRobsondMetricsAbsent needs 10 minutes of
              # missing series, so a fast restart is invisible to it. The kill
              # was found by hand, three days later, only because the operator
              # asked about something else.
              - name: rbx.robson.runtime
                rules:
                  # The window comes from the termination timestamp, NOT from
                  # increase() over the restart counter. increase() only sees a
                  # rise Prometheus actually observed: a container OOMKilled
                  # before its first scrape is already at 1 when first seen, so
                  # the counter never appears to move and the alert stays silent
                  # through the exact event it exists for.
                  - alert: RBXRobsondOOMKilled
                    expr: |
                      max by (namespace, pod, container) (
                        kube_pod_container_status_last_terminated_reason{namespace="robson",container="robsond",reason="OOMKilled"}
                      ) == 1
                      and on (namespace, pod, container) (
                        time() - max by (namespace, pod, container) (
                          kube_pod_container_status_last_terminated_timestamp{namespace="robson",container="robsond"}
                        )
                      ) < 7200
                    for: 0m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond was OOMKilled"
                      description: >-
                        The robsond container hit its memory limit and was
                        killed within the last 2 hours. Trading was unattended
                        for the duration of the restart; the exchange insurance
                        stop is the only protection during that window
                        (ADR-0039). Check the memory trend before assuming it
                        was a one-off.

                  - alert: RBXRobsondMemoryCritical
                    expr: |
                      max by (namespace, pod, container) (
                        container_memory_working_set_bytes{namespace="robson",container="robsond"}
                      )
                      / on (namespace, pod, container) group_left
                      max by (namespace, pod, container) (
                        kube_pod_container_resource_limits{namespace="robson",container="robsond",resource="memory"}
                      ) > 0.90
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond memory above 90% of its limit"
                      description: >-
                        robsond working set has been above 90% of its memory
                        limit for 5 minutes. An OOMKill is imminent. If a
                        position is open, prefer acting now over being
                        restarted mid-trade.

                  - alert: RBXRobsondMemoryApproachingLimit
                    expr: |
                      max by (namespace, pod, container) (
                        container_memory_working_set_bytes{namespace="robson",container="robsond"}
                      )
                      / on (namespace, pod, container) group_left
                      max by (namespace, pod, container) (
                        kube_pod_container_resource_limits{namespace="robson",container="robsond",resource="memory"}
                      ) > 0.75
                    for: 15m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond memory above 75% of its limit"
                      description: >-
                        robsond working set has been above 75% of its memory
                        limit for 15 minutes. The growth cause is not
                        identified as of 2026-08-18; at the rate measured then
                        (roughly 13 to 15 MiB/h under active market data) this
                        leaves hours, not days, before the limit.

                  - alert: RBXRobsondContainerRestarted
                    expr: |
                      max by (namespace, pod, container) (
                        increase(kube_pod_container_status_restarts_total{namespace="robson",container="robsond"}[15m])
                      ) > 0
                    for: 0m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond container restarted"
                      description: >-
                        The robsond container restarted IN PLACE in the last 15
                        minutes: OOMKill, liveness kill or crash. It does NOT
                        catch a rollout, because a new pod starts its restart
                        counter at zero, and that is deliberate: a deploy the
                        operator asked for should not page. Prolonged absence
                        from any cause is covered by RBXRobsondMetricsAbsent.

              # ADR-0056 step 7, PR F (the fence): design v8 §7's alerts, which
              # must be loaded before F part 2 deploys. Every rule in this group
              # reads robsond's own /metrics, so it selects on
              # `kubernetes_namespace` (see the LABEL WARNING above).
              #
              # These merge while production runs F part 1, and none may fire
              # on what part 1 lacks. Part 2 adds robsond_admission_fence_closed,
              # robsond_recovery_incidents_open and the stale-stop gauge at 0
              # from startup; part 4 adds the orphan-withheld counters. Every
              # rule on one of them is silent while it is absent. The page on
              # the fence metric's ABSENCE, RBXRobsondFenceMetricAbsent below,
              # fires on every image before part 2, so it merged separately,
              # once part 2 was in production.
              #
              # EXPECTED PAGE: part 2's first start is fenced by design (its
              # predecessor marked version 1 at best, and a clean start needs
              # 2), so RBXRobsondAdmissionFenceClosed with reason unclean_start
              # pages 5 minutes after that deploy unless the operator releases
              # first. That page is not a failure.
              - name: rbx.robson.fence
                rules:
                  # §7: fence closed more than 5 min. One series per reason,
                  # so the page names what closed it. Every reason exports at
                  # 0 from startup from part 2 on; absent before it.
                  - alert: RBXRobsondAdmissionFenceClosed
                    expr: max by (reason) (robsond_admission_fence_closed{kubernetes_namespace="robson"}) == 1
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson admissions are fenced: {{ $labels.reason }}"
                      description: >-
                        An open incident ({{ $labels.reason }}) has kept new entries closed for 5 minutes
                        (ADR-0056 step 7). Exits, stops and the protective API continue. Read GET
                        /recovery/pending, then release at its generation with POST /recovery/release once the
                        risk is understood. A latch-class reason (any but unclean_start, uncertain_outcome and
                        unknown) needs a restart first: only a restart clears the latch. EXPECTED once, with reason
                        unclean_start, at the first deploy of PR F part 2: that start is fenced by design and this
                        pages unless the operator releases within 5 minutes. That page is not a failure.

                  # §7 and P: latch set. Also the backstop for an aborted or
                  # unpermitted operation counted before its first scrape,
                  # which increase() cannot see. Exported since PR J.
                  - alert: RBXRobsondJournalLatchSet
                    expr: max(robsond_journal_latch{kubernetes_namespace="robson"}) == 1
                    for: 1m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson journal latch is set"
                      description: >-
                        A venue send went out without its journal row, journal history was discarded or conflicted,
                        an event-log stream was suspended, an operation was aborted, a venue mutation ran without a
                        permit, or (from PR F part 2) the generation ran out. Admissions stay closed until a
                        restart, and from PR F part 2 until a release after it. The stop will not mark the epoch
                        clean.

                  # §7: unpermitted or aborted operations increasing. Both
                  # counters export at 0 from startup since PR S.
                  - alert: RBXRobsondUnpermittedOrAbortedOperation
                    expr: |
                      sum(increase(robsond_unpermitted_mutations_total{kubernetes_namespace="robson"}[10m])) > 0
                      or
                      sum(increase(robsond_aborted_operations_total{kubernetes_namespace="robson"}[10m])) > 0
                    for: 0m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson ran a venue mutation without a permit, or dropped an operation midway"
                      description: >-
                        Either may have reached the venue with nothing left to record the answer. The journal latch
                        is set, so admissions are closed until a restart (and from PR F part 2 a release). Check the
                        logs for the operation kind before releasing.

                  # §7 and P: a suspended system stream invalidates that
                  # month's accounting until step 8. Both kinds export at 0
                  # from startup since PR P.
                  - alert: RBXRobsondSystemStreamSuspended
                    expr: max(robsond_streams_suspended{kubernetes_namespace="robson",kind="system"}) > 0
                    for: 0m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson month-boundary stream suspended"
                      description: >-
                        A month reset or recalibration did not apply. That month's accounting is invalid: no
                        automatic MonthlyHalt, no new entries while it is current, no capacity in its month view,
                        and no release clears it. Nothing repairs a system stream before step 8; see
                        stream_suspensions.

                  # §7 and P: a suspended position stream. Startup repairs it
                  # when it can; one that stays invalidates its leg.
                  - alert: RBXRobsondPositionStreamSuspended
                    expr: max(robsond_streams_suspended{kubernetes_namespace="robson",kind="position"}) > 0
                    for: 5m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson position stream suspended"
                      description: >-
                        A position's event stream refuses appends. The next start repairs it if its suffix is
                        repairable; until then the leg's snapshot is invalid and the budget reports no capacity
                        while it is risk-open. See stream_suspensions.repair_error.

                  # §7: any stop not clean. robsond_graceful_stop_total cannot
                  # carry this: the stop closes the API listener before it
                  # counts its result, so no scrape sees it. The durable record
                  # is the next start's marker check. Only no_marker: every
                  # start of an image before F part 2 reports marker_version
                  # (version 2 is F's), and from part 2 that reason opens an
                  # unclean_start incident, which the fence alert pages. The
                  # gauge stays 1 for the life of the process, so the alert is
                  # held to the robsond container's first hour, by the start
                  # time kube-state-metrics reports for it (robsond is the
                  # container's PID 1 and exports no process start time),
                  # joined per pod: it warns in each start's first hour, an
                  # in-place restart included, and not for a scrape gap or an
                  # older process.
                  #
                  # Without kube-state-metrics this goes quiet, deliberately:
                  # firing on the exporter's absence would warn for the life of
                  # every process, whatever its start. That reduces coverage.
                  # From F part 2 an unclean start is still paged by
                  # RBXRobsondAdmissionFenceClosed, which needs no
                  # kube-state-metrics, unless a release comes within its 5
                  # minutes.
                  - alert: RBXRobsondUncleanStart
                    expr: |
                      max by (reason) (
                        label_replace(
                          robsond_unclean_start{kubernetes_namespace="robson",reason="no_marker"} == 1,
                          "pod", "$1", "kubernetes_pod_name", "(.+)"
                        )
                        and on (pod)
                        (time() - max by (pod) (kube_pod_container_state_started{namespace="robson",container="robsond"}) < 3600)
                      )
                    for: 0m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson started after an unclean stop"
                      description: >-
                        The previous robsond process wrote no clean-stop marker: it crashed or was killed (OOM,
                        SIGKILL), ran past its stop deadline, or stopped latched, with an operation aborted,
                        something unlanded or (from PR F part 2) an incident open. From PR F part 2 this start is
                        also fenced until a release. Held to the robsond container's first hour by its start time
                        from kube-state-metrics, and quiet without it.

                  # #320: the month's reset has not landed, so the basis is
                  # invalid and entries are denied until it does. 0 from
                  # startup.
                  - alert: RBXRobsondMonthBoundaryPending
                    expr: max(robsond_month_boundary_pending{kubernetes_namespace="robson"}) == 1
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson month-boundary reset has not landed"
                      description: >-
                        A boundary attempt failed (wallet read, the previous month's base, the database or a
                        suspended month stream) and the 60 s poll keeps retrying. Entries are denied meanwhile
                        (ADR-0051 §1). With Armed legs and no recorded previous base the reset waits for the
                        operator. The gauge is set when an attempt returns: it is not accounting health.

                  - alert: RBXRobsondMonthBoundaryPendingLong
                    expr: max(robsond_month_boundary_pending{kubernetes_namespace="robson"}) == 1
                    for: 60m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson month-boundary reset still pending after an hour"
                      description: >-
                        Entries have been denied for over an hour since a boundary attempt failed. Read the ERROR
                        log of handle_month_boundary for the cause.

                  # An open leg whose exchange stop is behind its plan. From F
                  # part 2 the gauge exports at 0 from startup; before it, it is
                  # absent until first set, and this rule is silent then.
                  - alert: RBXRobsondInsuranceStopStale
                    expr: max(robsond_insurance_stop_stale_positions{kubernetes_namespace="robson"}) > 0
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson has open legs whose exchange stop is behind"
                      description: >-
                        A stop placement or re-placement failed and the tick-cadence retry has not healed it for 5
                        minutes (ADR-0039). Daemon-down exposure is wider than one rung.

                  # The stale-stop gauge's absence must not read as healthy,
                  # but it is absent on every image before F part 2. So this
                  # asks only of a daemon that exports the fence (part 2 on),
                  # which must also export this gauge from startup.
                  - alert: RBXRobsondInsuranceStopGaugeAbsent
                    expr: |
                      absent(robsond_insurance_stop_stale_positions{kubernetes_namespace="robson"})
                      and on ()
                      (count(robsond_admission_fence_closed{kubernetes_namespace="robson"}) > 0)
                    for: 15m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson exports its fence but not its stale-stop gauge"
                      description: >-
                        robsond_insurance_stop_stale_positions is missing from a robsond that exports
                        robsond_admission_fence_closed, so RBXRobsondInsuranceStopStale cannot fire. From PR F
                        part 2 the gauge exports at 0 from startup: this is a regression.

                  # The retry set holding entries. Exported since PR J; counts
                  # incident upserts from F part 2.
                  - alert: RBXRobsondJournalRetrySetStuck
                    expr: max(robsond_journal_retry_set_depth{kubernetes_namespace="robson"}) > 0
                    for: 10m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson journal writes have been pending for 10 minutes"
                      description: >-
                        Journal rows, stream suspensions or (from PR F part 2) incident upserts are not landing. A
                        stop cannot mark clean and a release answers `persisting` meanwhile. At 1,024 entries the
                        next one is a persistence failure, which latches.

                  # F part 4: orphan stops kept while fenced. The veto is doing
                  # its job; the orphans go after a release. Both counters
                  # export at 0 from startup from part 4; absent before it.
                  - alert: RBXRobsondOrphanStopsWithheld
                    expr: sum(increase(robsond_orphan_cancel_withheld_total{kubernetes_namespace="robson"}[30m])) > 0
                    for: 30m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson is keeping orphan stop orders while fenced"
                      description: >-
                        For 30 minutes the sweep has kept ins- orders outside coverage because an incident is open,
                        the fence is closed or the latch is set (design §2.9). They may partially reduce an Active
                        leg on the same symbol and side. The pending list shows them under
                        withheld_protective_orders.

                  - alert: RBXRobsondOrphanWithheldReportTruncated
                    expr: sum(increase(robsond_orphan_cancel_withheld_overflow_total{kubernetes_namespace="robson"}[30m])) > 0
                    for: 0m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "More than 500 orphan stops withheld in one scan"
                      description: >-
                        The pending list shows 500; the veto applies to every one. Read the venue's open orders.

                  # J: an operation charged more journal statements than the
                  # reviewed bound. Forty is a warning threshold for composite
                  # operations (a multi-leg tick, a scan, /panic, startup), not
                  # a maximum. The gauge only grows within a process, so
                  # increase() reads it as the counter it is, across a reset it
                  # observes. The second half catches a startup that went past
                  # the bound before the first scrape, when no rise or reset is
                  # ever seen (an in-place restart from 1 back to 1): any count
                  # in the robsond container's first hour, by the start time
                  # kube-state-metrics reports, joined per pod. Without
                  # kube-state-metrics only the first half works: a startup
                  # past the bound then goes unwarned, and no other rule
                  # covers it.
                  - alert: RBXRobsondJournalStatementBound
                    expr: |
                      sum(increase(robsond_journal_operations_over_statement_bound{kubernetes_namespace="robson"}[1h])) > 0
                      or
                      sum(
                        label_replace(
                          robsond_journal_operations_over_statement_bound{kubernetes_namespace="robson"} > 0,
                          "pod", "$1", "kubernetes_pod_name", "(.+)"
                        )
                        and on (pod)
                        (time() - max by (pod) (kube_pod_container_state_started{namespace="robson",container="robsond"}) < 3600)
                      ) > 0
                    for: 0m
                    labels:
                      severity: warning
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "A Robson operation went past 40 journal statements"
                      description: >-
                        A warning threshold for composite operations, not a maximum. Review the operation's venue
                        work for a loop; robsond_journal_operation_statements_max shows the largest since the start.

              # §7 negative control: the alerts above say nothing while robsond
              # is missing. The fence metric absent for 5 minutes, the target
              # down for 3 minutes, or robsond restarting for 2 minutes, pages.
              - name: rbx.robson.fence.negative-control
                rules:
                  # Every reason exports at 0 from startup from F part 2 on, so
                  # an absent series means a missing daemon, not an open fence.
                  # It also fires on any image before part 2, which is why it
                  # merged only once part 2 was in production. A deliberate
                  # rollback to such an image pages here until it is silenced.
                  - alert: RBXRobsondFenceMetricAbsent
                    expr: absent(robsond_admission_fence_closed{kubernetes_namespace="robson"})
                    for: 5m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "Robson's admission fence is not being exported"
                      description: >-
                        No robsond_admission_fence_closed series from namespace robson for 5 minutes: robsond is
                        down or not scraped, or runs an image before PR F part 2. Every fence alert is blind
                        meanwhile, and the exchange stops are the only protection.

                  # Pod discovery drops the target with the pod, so a missing
                  # target is absent, not up == 0. A deploy (Recreate) is a
                  # gap too: measured over the 7 days to 2026-11-11, at most
                  # 4 evaluations (about 2 minutes) in the SIGKILL-era deploys
                  # and 3 since stops are clean. §7 says 2 minutes; 3 leaves
                  # room for an image pull and the startup scan.
                  - alert: RBXRobsondTargetDown
                    expr: absent(up{job="kubernetes-pods-annotations",kubernetes_namespace="robson",kubernetes_pod_name=~"robsond-.+"} == 1)
                    for: 3m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond is not being scraped"
                      description: >-
                        No healthy robsond scrape target for 3 minutes, longer than a deploy's gap: down,
                        restarting, or scrape broken. The exchange stops are the only protection meanwhile.

                  # kube-state-metrics, so `namespace`. A start that cannot
                  # record its epoch, reach its journal or pass the
                  # stale-active gate (exit 78) loops here.
                  - alert: RBXRobsondRestarting
                    expr: |
                      max by (namespace, pod, container, reason) (
                        kube_pod_container_status_waiting_reason{
                          namespace="robson",container="robsond",
                          reason=~"CrashLoopBackOff|CreateContainerError|CreateContainerConfigError|RunContainerError"
                        }
                      ) == 1
                    for: 2m
                    labels:
                      severity: critical
                      rbx_workstream: robson-trading
                    annotations:
                      summary: "robsond is restarting ({{ $labels.pod }}: {{ $labels.reason }})"
                      description: >-
                        The robsond container has been waiting to start again for 2 minutes. A fast crash loop
                        shows first as RBXRobsondTargetDown; this one names the pod and the reason.

        # Temporarily disable PrometheusRule admission webhooks until the
        # webhook serving certificate/CA bundle is regenerated in an approved
        # maintenance window. The broken CA currently blocks ArgoCD from
        # reconciling PrometheusRule resources.
          rbx-infra-continuity:
            groups:
              - name: rbx.infra.continuity
                rules:
                  - alert: RBXCriticalServiceUnavailable
                    expr: kube_deployment_status_replicas_available{namespace="kube-system",deployment=~"traefik|coredns"} < 1
                    for: 30s
                    labels:
                      severity: critical
                      rbx_workstream: infra
                    annotations:
                      summary: Critical service {{ $labels.deployment }} has no ready replica
                      description: Check endpoints and node pressure before restarting or draining a control-plane host.
                  - alert: RBXCriticalServiceRedundancyLost
                    expr: kube_deployment_status_replicas_available{namespace="kube-system",deployment=~"traefik|coredns"} < 2
                    for: 2m
                    labels:
                      severity: warning
                      rbx_workstream: infra
                    annotations:
                      summary: Critical service {{ $labels.deployment }} has lost redundancy
                      description: Restore two available replicas on distinct hosts. Check the RBX reliability runbook.
                  - alert: RBXNodeReadyLost
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 1m
                    labels:
                      severity: critical
                      rbx_workstream: infra
                    annotations:
                      summary: Node {{ $labels.node }} is not Ready
                      description: Check etcd quorum, host memory and local volumes before maintenance.
                  - alert: RBXNodeMemoryHeadroomLow
                    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
                    for: 5m
                    labels:
                      severity: warning
                      rbx_workstream: infra
                    annotations:
                      summary: Node {{ $labels.instance }} has less than 15% available memory
                      description: Investigate before evictions or API overload; do not drain local-path workloads blindly.
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.selector
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.selector
