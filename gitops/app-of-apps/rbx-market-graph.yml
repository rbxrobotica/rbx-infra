# ArgoCD Application: RBX Market Graph + Kairos operator surface.
# Host: kairos.rbxsystems.ch. The API remains cluster-internal.
# Prerequisites completed before registration:
#   - ADR-0609 through ADR-0613 accepted in rbx-governance
#   - immutable API and web images published from the same product main SHA
#   - rbx-market-graph database and scoped roles provisioned on jaguar
#   - source and image-pull Secrets staged by an authorized operator
#   - dedicated ZITADEL project, client, roles and owner grant provisioned
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbx-market-graph
  namespace: argocd
  labels:
    app.kubernetes.io/name: rbx-market-graph
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: rbx-market-graph
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rbx-applications
  source:
    repoURL: https://github.com/rbxrobotica/rbx-infra
    targetRevision: main
    path: apps/prod/rbx-market-graph
  destination:
    server: https://kubernetes.default.svc
    namespace: rbx-market-graph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
