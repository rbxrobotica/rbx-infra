# ArgoCD Application: rbx-briefing-btc (logged-in Briefing BTC area)
# Host: app.merovelis.com/briefing-btc, the canonical Hub entrypoint
# (rbx-governance ADR-0014). SvelteKit on Bun behind a dedicated
# rbx-session-bff instance in the same namespace. Automated sync is enabled
# from the start; the web image tag in apps/prod/rbx-briefing-btc/
# kustomization.yml is a placeholder until the first rbx-briefing-btc publish,
# so the Application stays Progressing (ImagePullBackOff) until a real
# sha-<commit> tag is promoted (docs/infra/IMAGE-PROMOTION.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbx-briefing-btc
  namespace: argocd
  labels:
    app.kubernetes.io/name: rbx-briefing-btc
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: rbx-briefing-btc
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rbx-applications
  source:
    repoURL: https://github.com/rbxrobotica/rbx-infra
    targetRevision: main
    path: apps/prod/rbx-briefing-btc
  destination:
    server: https://kubernetes.default.svc
    namespace: rbx-briefing-btc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
