# ArgoCD Application: RBX Atlas (founders' frontend discovery directory)
# Host: atlas.rbx.ia.br. ADR-0028 topology amendment 2026-09-05, phase 1
# (public exposure). Manual sync (no automated block) while the placeholder
# tag sha-0000000 is in apps/prod/rbx-atlas/kustomization.yml. The first
# promotion is a reviewed pull request that replaces the placeholder AND adds
# `automated: {prune: true, selfHeal: true}` here; from then on the rbx-atlas
# publish workflow promotes tags to main and Argo CD converges automatically
# (the workflow skips promotion while the placeholder is present).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbx-atlas
  namespace: argocd
  labels:
    app.kubernetes.io/name: rbx-atlas
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: rbx-atlas
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rbx-applications
  source:
    repoURL: https://github.com/rbxrobotica/rbx-infra
    targetRevision: main
    path: apps/prod/rbx-atlas
  destination:
    server: https://kubernetes.default.svc
    namespace: rbx-atlas
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
