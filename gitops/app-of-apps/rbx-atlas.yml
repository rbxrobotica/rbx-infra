# ArgoCD Application: RBX Atlas (founders' frontend discovery directory)
# Host: atlas.rbx.ia.br. ADR-0028 topology amendment 2026-09-05, phase 1
# (public exposure). The first rollout was a manual, validated sync of image
# sha-fabc775 (PR 236, operator validation on 2026-09-06: pods ready, /healthz,
# HTTPS redirect, public exposure only). Automated sync is enabled from here
# on, so tags promoted to main by the rbx-atlas publish workflow converge
# without manual steps (the workflow promotes only while this block exists).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbx-atlas
  namespace: argocd
  labels:
    app.kubernetes.io/name: rbx-atlas
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: rbx-atlas
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rbx-applications
  source:
    repoURL: https://github.com/rbxrobotica/rbx-infra
    targetRevision: main
    path: apps/prod/rbx-atlas
  destination:
    server: https://kubernetes.default.svc
    namespace: rbx-atlas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
